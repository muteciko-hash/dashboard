<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kabin Hava Durumu Ekranı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --glass-surface-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.09) 100%);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.42);
      --glass-shadow: 0 14px 34px rgba(0, 0, 0, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.28);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.78);
      --text-soft: rgba(255, 255, 255, 0.58);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d1518;
      color: var(--text-main);
    }

    /* Arka Plan Fotoğraf Katmanları */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: opacity 0.9s ease-in-out;
      z-index: 0;
    }

    /* Okunabilirliği Artıran Sinematik Gölge Katmanı */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 15, 19, 0.48) 0%, rgba(8, 15, 19, 0.14) 46%, rgba(6, 13, 12, 0.62) 100%),
        radial-gradient(circle at 24% 38%, rgba(0, 0, 0, 0.26), transparent 62%);
    }

    /* Ana Kapsayıcı - Ekrana Tam Oturma */
    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: clamp(10px, 2.2vh, 24px) clamp(14px, 2.4vw, 32px);
      display: flex;
      gap: clamp(14px, 2.2vw, 28px);
    }

    /* Gelişmiş Cam Efekti Sınıfı */
    .glass-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(26px) saturate(165%);
      -webkit-backdrop-filter: blur(26px) saturate(165%);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      border-left-color: rgba(255, 255, 255, 0.32);
      box-shadow: var(--glass-shadow);
    }

    /* Sol Dikey Cam Menü Çubuğu */
    .sidebar {
      width: clamp(44px, 4.4vw, 56px);
      height: 100%;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(10px, 2vh, 18px) 0;
      flex-shrink: 0;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 2.2vh, 22px);
    }

    .nav-btn {
      width: clamp(30px, 3.2vw, 36px);
      height: clamp(30px, 3.2vw, 36px);
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn:active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
    }

    .nav-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.12));
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    /* Sağ Ana İçerik Alanı */
    .main-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0;
    }

    /* Üst Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: clamp(32px, 5.5vh, 42px);
      flex-shrink: 0;
    }

    .welcome-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
    }

    .welcome-label {
      font-size: clamp(10px, 1.4vh, 11.5px);
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .user-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-name {
      font-size: clamp(13px, 1.9vh, 15px);
      font-weight: 600;
      letter-spacing: 0.1px;
      color: var(--text-main);
    }

    .gps-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.1vw, 12px);
    }

    .circle-btn {
      width: clamp(30px, 4.4vh, 36px);
      height: clamp(30px, 4.4vh, 36px);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0.08));
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-top-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .circle-btn:hover, .circle-btn:active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.14));
      transform: scale(1.04);
    }

    .avatar-btn {
      width: clamp(30px, 4.4vh, 36px);
      height: clamp(30px, 4.4vh, 36px);
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.48);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(30, 48, 56, 0.65));
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    /* Gövde Alanı */
    .dashboard-body {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: clamp(18px, 3vw, 40px);
      padding-top: clamp(6px, 1.6vh, 18px);
      min-height: 0;
    }

    /* Sol Bölüm */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0;
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .forecast-badge {
      display: inline-block;
      width: fit-content;
      font-size: clamp(10px, 1.5vh, 12px);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: clamp(6px, 1.2vh, 12px);
    }

    .hero-title {
      font-size: clamp(24px, 5.2vh, 52px);
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.6px;
      color: #ffffff;
      margin-bottom: clamp(6px, 1.4vh, 14px);
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.28);
    }

    .hero-title strong {
      font-weight: 500;
    }

    .hero-description {
      max-width: 390px;
      font-size: clamp(10.5px, 1.65vh, 12.5px);
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.84);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Alt Saatlik Eğri ve Günler */
    .timeline-wrapper {
      width: 100%;
      margin-top: auto;
      flex-shrink: 0;
    }

    .hourly-temps {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      align-items: center;
      text-align: center;
      margin-bottom: 2px;
    }

    .hour-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: clamp(12px, 1.9vh, 15px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.86);
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .hour-item.active {
      color: #ffffff;
      font-weight: 600;
      transform: scale(1.06);
    }

    .curve-box {
      position: relative;
      width: 100%;
      height: clamp(36px, 8.8vh, 72px);
      margin-bottom: clamp(4px, 1vh, 10px);
    }

    .curve-box svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .active-node {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.26), 0 0 14px rgba(255, 255, 255, 0.98);
      transform: translate(-50%, -50%);
      transition: left 0.4s cubic-bezier(0.22, 1, 0.36, 1), top 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .active-node::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: clamp(22px, 5vh, 42px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65), transparent);
    }

    .days-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      padding-top: clamp(6px, 1.4vh, 12px);
    }

    .day-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: clamp(10.5px, 1.6vh, 12.5px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.66);
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .day-btn.active {
      color: #ffffff;
      font-weight: 600;
    }

    .day-btn.active::before {
      content: '';
      position: absolute;
      top: calc(-1 * clamp(7px, 1.5vh, 13px));
      left: 20%;
      right: 20%;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }

    /* Sağ Sütun: Ana Derece + 3 Şehir Kartı */
    .right-panel {
      width: clamp(215px, 25vw, 295px);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(6px, 1.2vh, 14px);
      flex-shrink: 0;
      min-height: 0;
    }

    .current-weather-header {
      padding: 0 4px;
      flex-shrink: 0;
    }

    .location-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(11.5px, 1.7vh, 13.5px);
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
    }

    .main-temp {
      font-size: clamp(36px, 7.2vh, 70px);
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -2px;
      color: #ffffff;
      margin: clamp(2px, 0.5vh, 6px) 0 clamp(4px, 1vh, 10px) 0;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.22);
    }

    .metrics-row {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.2vw, 16px);
      font-size: clamp(10px, 1.45vh, 11.5px);
      color: rgba(255, 255, 255, 0.88);
    }

    .metric-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Şehir Kartları */
    .city-list {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: clamp(6px, 1.3vh, 12px);
      flex: 1;
      min-height: 0;
    }

    .city-card {
      border-radius: clamp(13px, 2vh, 18px);
      padding: clamp(7px, 1.55vh, 14px) clamp(12px, 1.6vw, 18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .city-card:hover, .city-card:active {
      background: var(--glass-surface-hover);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    .city-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .country-label {
      font-size: clamp(9px, 1.2vh, 10px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.68);
    }

    .city-name {
      font-size: clamp(12.5px, 1.85vh, 14.5px);
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .city-condition {
      font-size: clamp(9.5px, 1.35vh, 11px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.80);
    }

    .city-temp-wrap {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      flex-shrink: 0;
    }

    .city-temp {
      font-size: clamp(20px, 3.4vh, 28px);
      font-weight: 300;
      line-height: 1;
      color: #ffffff;
    }

    /* Cam Modal (İsim & Şehir Arama) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .glass-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .modal-btn.primary {
      background: rgba(255, 255, 255, 0.30);
      font-weight: 600;
    }

    .search-results {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }

    .search-result-item {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 13px;
      cursor: pointer;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Arka Plan Fotoğraf Katmanları -->
  <div id="bgLayerA" class="bg-layer" style="opacity: 1;"></div>
  <div id="bgLayerB" class="bg-layer" style="opacity: 0;"></div>
  <div class="bg-overlay"></div>

  <!-- Cihazdan Çoklu Arka Plan Fotoğrafı Seçici -->
  <input type="file" id="fileInput" accept="image/*" multiple />

  <div class="app-container">
    <!-- Sol Dikey Cam Menü Çubuğu -->
    <aside class="sidebar glass-panel">
      <div class="sidebar-top">
        <button class="nav-btn active" title="Tam Ekran Yap / Çık" onclick="toggleFullScreen()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </button>
        <button class="nav-btn" title="GPS Konumumu Güncelle" onclick="requestLocationAndWeather(true)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </button>
        <button class="nav-btn" title="Güzergah Şehirleri" onclick="openModal('city')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </button>
        <button class="nav-btn" title="Kaptan Adını Düzenle" onclick="openModal('name')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>

      <button class="nav-btn" title="Sonraki Arka Plan Fotoğrafı" onclick="nextBackground()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
    </aside>

    <!-- Ana İçerik -->
    <main class="main-area">
      <!-- Üst Bilgi Barı -->
      <header class="top-bar">
        <div class="welcome-box" onclick="openModal('name')" title="İsmi değiştirmek için dokunun">
          <span class="welcome-label">İyi Yolculuklar</span>
          <div class="user-name-row">
            <span class="user-name" id="driverName">Kaptan</span>
            <span class="gps-pill" id="gpsStatus">Konum bekleniyor...</span>
          </div>
        </div>

        <div class="top-actions">
          <button class="circle-btn" title="Arka Plan Fotoğrafları Seç" onclick="document.getElementById('fileInput').click()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <button class="circle-btn" title="Şehir Ara" onclick="openModal('city')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="20" y1="20" x2="16.35" y2="16.35"/>
            </svg>
          </button>
          <button class="circle-btn" title="GPS Konumu Yenile" onclick="requestLocationAndWeather(true)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </button>
          <div class="avatar-btn" title="Kaptan Profili" onclick="openModal('name')" id="avatarInitial">
            K
          </div>
        </div>
      </header>

      <!-- Gövde -->
      <div class="dashboard-body">
        <!-- Sol Bölüm -->
        <section class="left-panel">
          <div class="hero-section">
            <div class="forecast-badge">Hava Tahmini</div>
            <h1 class="hero-title" id="heroTitle">
              Yol Durumu<br><strong>Yükleniyor...</strong>
            </h1>
            <p class="hero-description" id="heroDesc">
              GPS konumu alınıyor. Güzergah üzerindeki rüzgar hızı, yağış olasılığı ve saatlik sıcaklık değişimi hazırlanıyor.
            </p>
          </div>

          <!-- Alt Sıcaklık Eğrisi ve Günler -->
          <div class="timeline-wrapper">
            <div class="hourly-temps" id="hourlyRow"></div>

            <div class="curve-box">
              <svg id="curveSvg" viewBox="0 0 600 76" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
                    <stop offset="50%" stop-color="rgba(255,255,255,0.98)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0.35)"/>
                  </linearGradient>
                  <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
                  </linearGradient>
                </defs>
                <path id="areaPath" fill="url(#areaGrad)" d=""/>
                <path id="linePath" fill="none" stroke="url(#curveGrad)" stroke-width="2" stroke-linecap="round" d=""/>
              </svg>
              <div id="activeNode" class="active-node"></div>
            </div>

            <div class="days-bar" id="daysBar"></div>
          </div>
        </section>

        <!-- Sağ Bölüm -->
        <aside class="right-panel">
          <div class="current-weather-header">
            <div class="location-row" onclick="requestLocationAndWeather(true)" title="GPS Konumuna Dön">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
              </svg>
              <span id="mainCity">Konum Belirleniyor</span>
            </div>

            <div class="main-temp" id="mainTemp">--°C</div>

            <div class="metrics-row">
              <span class="metric-item" title="Rüzgar Hızı">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                </svg>
                <span id="windVal">-- km/s</span>
              </span>
              <span class="metric-item" title="Nem Oranı">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
                <span id="humVal">--%</span>
              </span>
              <span class="metric-item" title="Rüzgar Hamlesi">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                </svg>
                <span id="gustVal">-- km/s</span>
              </span>
            </div>
          </div>

          <div class="city-list" id="cityList"></div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Kaptan Adı / Şehir Arama Cam Penceresi -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal-card glass-panel" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitle">Kaptan Adını Düzenle</div>
      <input type="text" id="modalInput" class="glass-input" placeholder="Adınızı veya araç adını yazın..." />
      <div class="search-results" id="searchResults"></div>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeModal()">İptal</button>
        <button class="modal-btn primary" id="modalSaveBtn" onclick="saveModal()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. KENDİ ARKA PLAN FOTOĞRAFLARIN (Aynı Klasördeki Dosya Adları)
       ===================================================================== */
    const ARKA_PLANLAR = [
      "arka-plan-1.jpg",
      "arka-plan-2.jpg",
      "arka-plan-3.jpg"
    ];

    const VARSAYILAN_FIRTINA_BG = `url("data:image/svg+xml;utf8,${encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'>
        <defs>
          <linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'>
            <stop offset='0%' stop-color='#1f3238'/>
            <stop offset='46%' stop-color='#445c60'/>
            <stop offset='66%' stop-color='#b5b38c'/>
            <stop offset='72%' stop-color='#475c34'/>
            <stop offset='100%' stop-color='#172414'/>
          </linearGradient>
          <radialGradient id='flash' cx='43%' cy='64%' r='35%'>
            <stop offset='0%' stop-color='rgba(255,252,230,0.88)'/>
            <stop offset='45%' stop-color='rgba(210,225,195,0.22)'/>
            <stop offset='100%' stop-color='rgba(0,0,0,0)'/>
          </radialGradient>
        </defs>
        <rect width='1600' height='900' fill='url(#sky)'/>
        <ellipse cx='420' cy='210' rx='460' ry='170' fill='#18262b' opacity='0.68'/>
        <ellipse cx='1080' cy='240' rx='520' ry='190' fill='#1e2f34' opacity='0.58'/>
        <rect width='1600' height='900' fill='url(#flash)'/>
        <polyline points='665,370 648,435 675,455 658,525 692,588' fill='none' stroke='#ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' opacity='0.95'/>
        <polyline points='675,455 705,495 698,530' fill='none' stroke='#ffffff' stroke-width='1.8' opacity='0.75'/>
        <path d='M0,620 Q420,595 820,618 T1600,605 L1600,900 L0,900 Z' fill='#283b1e' opacity='0.9'/>
        <path d='M0,675 Q520,645 980,680 T1600,660 L1600,900 L0,900 Z' fill='#192713' opacity='0.94'/>
      </svg>
    `)}")`;

    let gecerliBgListesi = [];
    let aktifBgIndex = 0;
    let aktifKatmanA = true;
    const bgLayerA = document.getElementById('bgLayerA');
    const bgLayerB = document.getElementById('bgLayerB');

    function setBackgroundImage(cssUrl) {
      const hedef = aktifKatmanA ? bgLayerB : bgLayerA;
      const eski = aktifKatmanA ? bgLayerA : bgLayerB;
      hedef.style.backgroundImage = cssUrl;
      hedef.style.opacity = '1';
      eski.style.opacity = '0';
      aktifKatmanA = !aktifKatmanA;
    }

    function initBackgrounds() {
      bgLayerA.style.backgroundImage = VARSAYILAN_FIRTINA_BG;
      ARKA_PLANLAR.forEach((dosya) => {
        const img = new Image();
        img.onload = () => {
          gecerliBgListesi.push(`url("${dosya}")`);
          if (gecerliBgListesi.length === 1) {
            setBackgroundImage(gecerliBgListesi[0]);
          }
        };
        img.src = dosya;
      });
    }

    function nextBackground() {
      if (gecerliBgListesi.length === 0) return;
      aktifBgIndex = (aktifBgIndex + 1) % gecerliBgListesi.length;
      setBackgroundImage(gecerliBgListesi[aktifBgIndex]);
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      gecerliBgListesi = files.map(f => `url("${URL.createObjectURL(f)}")`);
      aktifBgIndex = 0;
      setBackgroundImage(gecerliBgListesi[0]);
    });

    /* =====================================================================
       2. KAPTAN İSMİ KAYDETME (localStorage)
       ===================================================================== */
    function loadDriverName() {
      const saved = localStorage.getItem('tir_kaptan_adi') || 'Kaptan';
      document.getElementById('driverName').textContent = saved;
      document.getElementById('avatarInitial').textContent = saved.charAt(0).toUpperCase();
    }

    /* =====================================================================
       3. HAVA DURUMU KODLARI VE CANLI API ENTEGRASYONU
       ===================================================================== */
    function decodeWeather(code) {
      if (code === 0) return { top: "Açık Gökyüzü", bold: "ve Güneşli", short: "Açık", type: "sun" };
      if ([1, 2].includes(code)) return { top: "Parçalı Bulutlu", bold: "ve Açık Görüş", short: "Parçalı Bulutlu", type: "cloud" };
      if (code === 3) return { top: "Çok Bulutlu", bold: "ve Kapalı Hava", short: "Çok Bulutlu", type: "cloud" };
      if ([45, 48].includes(code)) return { top: "Yoğun Sis", bold: "Düşük Görüş Mesafesi", short: "Sisli", type: "cloud" };
      if ([51, 53, 55, 61, 80].includes(code)) return { top: "Hafif Yağmur", bold: "ve Islak Zemin", short: "Yağmurlu", type: "rain" };
      if ([63, 65, 81, 82].includes(code)) return { top: "Sağanak", bold: "ve Şiddetli Yağmur", short: "Sağanak Yağış", type: "rain" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { top: "Kar Yağışı", bold: "ve Buzlanma Riski", short: "Karlı", type: "rain" };
      if ([95, 96, 99].includes(code)) return { top: "Fırtına", bold: "ve Şiddetli Sağanak", short: "Fırtınalı", type: "rain" };
      return { top: "Değişken", bold: "Hava Koşulları", short: "Bulutlu", type: "cloud" };
    }

    function getSmallIcon(type) {
      if (type === "sun") {
        return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>`;
      }
      if (type === "rain") {
        return `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`;
      }
      return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;
    }

    let gunlukVeriler = [];
    let seciliGun = 0;
    let seciliNokta = 2;

    const GUN_ISIMLERI = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    async function fetchWeatherForCoords(lat, lon, cityName) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();

        const curTemp = Math.round(data.current.temperature_2m);
        const curWind = Math.round(data.current.wind_speed_10m);
        const curHum = Math.round(data.current.relative_humidity_2m);
        const curGust = Math.round(data.current.wind_gusts_10m);
        const curCode = data.current.weather_code;

        document.getElementById('mainCity').textContent = cityName;
        document.getElementById('mainTemp').textContent = `${curTemp}°C`;
        document.getElementById('windVal').textContent = `${curWind} km/s`;
        document.getElementById('humVal').textContent = `${curHum}%`;
        document.getElementById('gustVal').textContent = `${curGust} km/s`;

        // 6 Günlük veriyi hazırla
        gunlukVeriler = [];
        for (let d = 0; d < 6; d++) {
          const dateObj = new Date(data.daily.time[d] + "T12:00:00");
          const dayName = d === 0 ? "Bugün" : GUN_ISIMLERI[dateObj.getDay()];
          const wCode = d === 0 ? curCode : data.daily.weather_code[d];
          const wInfo = decodeWeather(wCode);
          const maxT = Math.round(data.daily.temperature_2m_max[d]);
          const minT = Math.round(data.daily.temperature_2m_min[d]);
          const rainProb = data.daily.precipitation_probability_max[d] ?? 0;
          const maxW = Math.round(data.daily.wind_speed_10m_max[d]);

          // O günün 6 saatlik kesiti (06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
          const baseIdx = d * 24;
          const saatIndeksleri = [6, 9, 12, 15, 18, 21];
          const temps = saatIndeksleri.map(h => Math.round(data.hourly.temperature_2m[baseIdx + h] ?? curTemp));
          const types = saatIndeksleri.map(h => decodeWeather(data.hourly.weather_code[baseIdx + h] ?? wCode).type);

          gunlukVeriler.push({
            dayName,
            temps,
            types,
            title: `${wInfo.top}<br><strong>${wInfo.bold}</strong>`,
            desc: `${cityName} güzergahında gün içi en yüksek sıcaklık ${maxT}°C, en düşük ${minT}°C. Rüzgar hızı saatte ${maxW} km/s seviyelerinde, yağış ihtimali %${rainProb}.`
          });
        }

        seciliGun = 0;
        const currentHour = new Date().getHours();
        seciliNokta = Math.min(5, Math.max(0, Math.floor((currentHour - 5) / 3)));
        renderDaysAndCurve();
      } catch (err) {
        document.getElementById('gpsStatus').textContent = 'Bağlantı hatası';
      }
    }

    async function reverseGeocode(lat, lon) {
      try {
        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=tr`);
        const info = await res.json();
        const ilce = info.locality || info.city || "";
        const il = info.principalSubdivision || "";
        if (ilce && il && ilce !== il) return `${ilce}, ${il}`;
        return ilce || il || "Mevcut Konum";
      } catch {
        return "GPS Konumu";
      }
    }

    function requestLocationAndWeather(forcePrompt = false) {
      const statusEl = document.getElementById('gpsStatus');
      statusEl.textContent = 'Konum izni isteniyor...';

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            statusEl.textContent = 'GPS Aktif';
            const placeName = await reverseGeocode(latitude, longitude);
            fetchWeatherForCoords(latitude, longitude, placeName);
          },
          async () => {
            statusEl.textContent = 'Ağ Konumu';
            await fallbackIpLocation();
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: forcePrompt ? 0 : 60000 }
        );
      } else {
        statusEl.textContent = 'Ağ Konumu';
        fallbackIpLocation();
      }
    }

    async function fallbackIpLocation() {
      try {
        const res = await fetch('https://ipwho.is/');
        const data = await res.json();
        if (data && data.latitude) {
          fetchWeatherForCoords(data.latitude, data.longitude, data.city || "İstanbul");
          return;
        }
      } catch {}
      fetchWeatherForCoords(41.0082, 28.9784, "İstanbul");
    }

    /* =====================================================================
       4. GÜZERGAH ŞEHİR KARTLARI (Sağ Sütun)
       ===================================================================== */
    const guzergahSehirleri = [
      { name: "İstanbul", country: "Türkiye", lat: 41.0082, lon: 28.9784 },
      { name: "Bolu", country: "Türkiye", lat: 40.7392, lon: 31.6089 },
      { name: "Ankara", country: "Türkiye", lat: 39.9334, lon: 32.8597 }
    ];

    async function loadRouteCards() {
      const listEl = document.getElementById('cityList');
      listEl.innerHTML = '';

      for (const city of guzergahSehirleri) {
        let tempText = "--°";
        let condText = "Yükleniyor";
        let iconType = "cloud";

        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code`);
          const data = await res.json();
          tempText = `${Math.round(data.current.temperature_2m)}°`;
          const decoded = decodeWeather(data.current.weather_code);
          condText = decoded.short;
          iconType = decoded.type;
        } catch {}

        const card = document.createElement('div');
        card.className = 'city-card glass-panel';
        card.innerHTML = `
          <div class="city-info">
            <span class="country-label">${city.country}</span>
            <span class="city-name">${city.name}</span>
            <span class="city-condition">${condText}</span>
          </div>
          <div class="city-temp-wrap">
            <span class="city-temp">${tempText}</span>
            ${getSmallIcon(iconType)}
          </div>
        `;
        card.onclick = () => {
          document.getElementById('gpsStatus').textContent = 'Seçili Şehir';
          fetchWeatherForCoords(city.lat, city.lon, city.name);
        };
        listEl.appendChild(card);
      }
    }

    /* =====================================================================
       5. SAATLİK EĞRİ VE GÜNLER ÇİZİMİ
       ===================================================================== */
    function renderDaysAndCurve() {
      if (!gunlukVeriler.length) return;
      const veri = gunlukVeriler[seciliGun];

      document.getElementById('heroTitle').innerHTML = veri.title;
      document.getElementById('heroDesc').textContent = veri.desc;

      // Gün butonları
      const daysBar = document.getElementById('daysBar');
      daysBar.innerHTML = '';
      gunlukVeriler.forEach((g, idx) => {
        const btn = document.createElement('button');
        btn.className = 'day-btn' + (idx === seciliGun ? ' active' : '');
        btn.textContent = g.dayName;
        btn.onclick = () => {
          seciliGun = idx;
          renderDaysAndCurve();
        };
        daysBar.appendChild(btn);
      });

      // Saatlik sıcaklıklar
      const hourlyRow = document.getElementById('hourlyRow');
      hourlyRow.innerHTML = '';
      veri.temps.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'hour-item' + (i === seciliNokta ? ' active' : '');
        div.innerHTML = `<span>${t}°</span>${getSmallIcon(veri.types[i])}`;
        div.onclick = () => {
          seciliNokta = i;
          renderDaysAndCurve();
        };
        hourlyRow.appendChild(div);
      });

      // Eğri noktaları
      const temps = veri.temps;
      const minT = Math.min(...temps);
      const maxT = Math.max(...temps);
      const pts = temps.map((t, i) => {
        const x = (i + 0.5) * (600 / 6);
        const norm = maxT === minT ? 0.5 : (t - minT) / (maxT - minT);
        const y = 58 - norm * 38;
        return { x, y };
      });

      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cpX = (pts[i].x + pts[i + 1].x) / 2;
        d += ` C ${cpX} ${pts[i].y}, ${cpX} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }

      document.getElementById('linePath').setAttribute('d', d);
      document.getElementById('areaPath').setAttribute('d', `${d} L ${pts[pts.length - 1].x} 76 L ${pts[0].x} 76 Z`);

      const aktifPt = pts[seciliNokta];
      const node = document.getElementById('activeNode');
      node.style.left = `${(aktifPt.x / 600) * 100}%`;
      node.style.top = `${(aktifPt.y / 76) * 100}%`;
    }

    /* =====================================================================
       6. İSİM DEĞİŞTİRME VE ŞEHİR ARAMA PENCERESİ
       ===================================================================== */
    let activeModalMode = 'name';
    let searchTimer = null;

    function openModal(mode) {
      activeModalMode = mode;
      const backdrop = document.getElementById('modalBackdrop');
      const title = document.getElementById('modalTitle');
      const input = document.getElementById('modalInput');
      const results = document.getElementById('searchResults');
      const saveBtn = document.getElementById('modalSaveBtn');

      results.innerHTML = '';
      if (mode === 'name') {
        title.textContent = 'Kaptan / Araç Adını Düzenle';
        input.placeholder = 'Örn: Kaptan Ahmet veya 34 TR 01...';
        input.value = localStorage.getItem('tir_kaptan_adi') || '';
        saveBtn.style.display = 'inline-block';
      } else {
        title.textContent = 'Güzergah Şehri Ara';
        input.placeholder = 'Şehir adı yazın (Örn: Edirne, İzmir, Mersin)...';
        input.value = '';
        saveBtn.style.display = 'none';
      }

      backdrop.classList.add('open');
      setTimeout(() => input.focus(), 50);
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function saveModal() {
      if (activeModalMode === 'name') {
        const val = document.getElementById('modalInput').value.trim() || 'Kaptan';
        localStorage.setItem('tir_kaptan_adi', val);
        loadDriverName();
        closeModal();
      }
    }

    document.getElementById('modalInput').addEventListener('input', (e) => {
      if (activeModalMode !== 'city') return;
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      if (q.length < 2) return;

      searchTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr`);
          const data = await res.json();
          const resultsEl = document.getElementById('searchResults');
          resultsEl.innerHTML = '';
          (data.results || []).forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.textContent = `${item.name}${item.admin1 ? ', ' + item.admin1 : ''} (${item.country || ''})`;
            div.onclick = () => {
              document.getElementById('gpsStatus').textContent = 'Seçili Şehir';
              fetchWeatherForCoords(item.latitude, item.longitude, item.name);
              closeModal();
            };
            resultsEl.appendChild(div);
          });
        } catch {}
      }, 300);
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Başlat
    loadDriverName();
    initBackgrounds();
    requestLocationAndWeather(false);
    loadRouteCards();
  </script>
</body>
</html>
