<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tır Panel">
<title>Tır Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--gl:rgba(255,255,255,.18);--cd:rgba(12,14,30,.42);--t:#f6f4ff;--d:rgba(246,244,255,.66);--gold:#f3c77a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#070918;color:var(--t);font:400 13px/1.25 -apple-system,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.bg{overflow:hidden}.bg .l{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.4s ease}
#bgG{position:fixed;inset:0;z-index:0;filter:blur(10px) brightness(.5) saturate(1.1);transform:scale(1.06)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.app{position:relative;z-index:2;height:100%;display:flex;gap:10px;padding:10px}
nav{align-self:center;display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:26px;background:var(--cd);border:1px solid var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav button{all:unset;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--d);cursor:pointer}
nav button.on{background:rgba(255,255,255,.22);color:#fff}nav button.off{opacity:.3;pointer-events:none}
nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0;min-height:0}
.page{display:none;height:100%;gap:10px}.page.on{display:grid}
#pgW{grid-template-columns:1.75fr 1fr;grid-template-rows:1.15fr 1fr}
#pgR{grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr}
.c{position:relative;border-radius:20px;border:1px solid var(--gl);background:var(--cd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 14px;overflow:hidden;min-width:0;min-height:0}
.c h2{font-size:11px;font-weight:500;color:var(--d);margin-bottom:4px}
.hero{padding:0;background:none}.hero .bg{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.5))}
.hero .in{position:relative;height:100%;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.loc{display:flex;align-items:center;gap:6px;font-size:13px}.loc svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.lab{font-size:11px;color:var(--d)}
.cond{font-size:clamp(28px,8.5vh,56px);font-weight:300;letter-spacing:-.01em;line-height:1.05}
.hero svg.ic{position:absolute;right:16px;bottom:16px;width:clamp(48px,15vh,80px);height:clamp(48px,15vh,80px);filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.crv{height:calc(100% - 20px);display:flex;flex-direction:column}
.crv svg{flex:1;min-height:0;width:100%}
.hr{display:flex}.hr div{flex:1;text-align:center;font-size:11px;color:var(--d)}.hr b{display:block;font-size:clamp(15px,4vh,22px);font-weight:300;color:var(--t)}
.side{grid-row:1/3;grid-column:2;overflow:auto}
.date{font-size:12px;color:var(--d)}
.bigt{font-size:clamp(56px,17vh,104px);font-weight:200;line-height:1;margin:2px 0 4px}
.rows div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--d)}.rows b{font-weight:500;color:var(--t)}
.days div{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.days svg{width:26px;height:26px;flex:none}.days span{flex:1;color:var(--d)}.days b{font-weight:500}
.cmp svg{width:100%;height:calc(100% - 18px)}
.alt{font-size:clamp(30px,9vh,48px);font-weight:200;line-height:1}.sub{font-size:11px;color:var(--d)}
.sp{width:100%;height:28%;margin:6px 0}
.co{font-size:11px;color:var(--d)}.co b{display:block;font-size:14px;font-weight:500;color:var(--t)}
.mp{padding:0;grid-row:1/3}#map{width:100%;height:100%;background:#0b0d1f;filter:hue-rotate(40deg) saturate(.8)}
.leaflet-control-attribution,.leaflet-control-zoom{display:none}
#hi{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;text-align:center;background:rgba(7,9,24,.8);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:opacity 1s,visibility 1s}
#hi.out{opacity:0;visibility:hidden}
#hi .orb{position:absolute;width:min(60vw,60vh);aspect-ratio:1;border-radius:50%;background:conic-gradient(#ff5fa2,#6aa8ff,#ffb347,#ff5fa2);filter:blur(60px);opacity:.38;animation:sp 9s linear infinite}
#hi h2{position:relative;font-size:clamp(30px,8vw,64px);font-weight:200;animation:rs 1.6s both}#hi p{position:relative;margin-top:10px;color:var(--d);animation:rs 1.6s .5s both}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes rs{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#hi .orb,#hi h2,#hi p{animation:none}}
@media (max-aspect-ratio:1/1){
 html,body{overflow:auto}.app{flex-direction:column-reverse;height:auto;min-height:100%}
 nav{flex-direction:row;align-self:center}main{overflow:visible}
 .page.on{display:flex;flex-direction:column;height:auto}.hero{height:240px}.crv{height:170px}.side{overflow:visible}.mp{height:300px}.cmp,.pos{height:190px}
}
</style>
</head>
<body>
<div class="bg" id="bgG"></div><canvas id="fx"></canvas>
<div id="hi"><div class="orb"></div><div><h2 id="hiT"></h2><p>İyi yolculuklar</p></div></div>

<div class="app">
<nav>
 <button class="on" data-p="pgW" aria-label="Hava"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/></svg></button>
 <button data-p="pgR" aria-label="Yol"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
 <button class="off"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M7 8l10-5"/></svg></button>
</nav>
<main>
<section class="page on" id="pgW">
 <div class="c hero"><div class="bg" id="bgH"></div><div class="shade"></div>
  <div class="in"><div><div class="loc"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span id="where">Konum bekleniyor</span></div></div>
   <div><div class="lab" id="greet">Hava durumu</div><div class="cond" id="cond">Hava alınıyor</div><div class="lab" id="note" style="margin-top:4px"></div></div></div>
  <svg class="ic" id="ic" viewBox="0 0 64 64"></svg></div>
 <div class="c"><h2>Saatlik sıcaklık</h2><div class="crv"><svg viewBox="0 0 600 60" preserveAspectRatio="none"><path id="curve" fill="none" stroke="#f3c77a" stroke-width="2.2" vector-effect="non-scaling-stroke" d=""/></svg><div class="hr" id="hrs"></div></div></div>
 <div class="c side"><div class="date" id="date">--</div><div class="bigt" id="tmp">--°</div>
  <div class="rows"><div>Hissedilen<b id="feel">--</b></div><div>Nem<b id="hum">--</b></div><div>Rüzgar<b id="wnd">--</b></div><div>Basınç<b id="prs">--</b></div><div>Gün doğumu / batımı<b id="sun">--</b></div></div>
  <h2 style="margin-top:12px">Sonraki günler</h2><div class="days" id="days"></div></div>
</section>

<section class="page" id="pgR">
 <div class="c mp"><div id="map"></div></div>
 <div class="c cmp" id="cmpC"><h2>Pusula <span id="hdg" style="float:right;color:var(--t)">---°</span></h2>
  <svg viewBox="-50 -50 100 100"><circle r="46" fill="none" stroke="rgba(255,255,255,.2)"/><g id="dial"></g><path d="M0-51l4 7h-8z" fill="#ff8a8a"/><path d="M0-30l5 30h-10z" fill="#fff"/><path d="M0 30l5-30h-10z" fill="rgba(255,255,255,.3)"/><circle r="2.2" fill="#fff"/></svg></div>
 <div class="c pos"><h2>Rakım</h2><div class="alt"><span id="alt">---</span><span class="sub"> m</span></div>
  <svg class="sp" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline id="spark" fill="none" stroke="#f3c77a" stroke-width="1.6" vector-effect="non-scaling-stroke" points=""/></svg>
  <div style="display:flex;gap:18px"><div class="co">Enlem<b id="lat">--</b></div><div class="co">Boylam<b id="lon">--</b></div></div></div>
</section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id),dirs=['K','KD','D','GD','G','GB','B','KB'];
const hello=()=>{const h=new Date().getHours();return(h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar')+' Halil'};
$('hiT').textContent=hello();$('greet').textContent=hello();
const hide=()=>$('hi').classList.add('out');setTimeout(hide,3800);$('hi').onclick=hide;
$('date').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
const wl=async()=>{try{await navigator.wakeLock.request('screen')}catch(e){}};wl();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()});

/* sayfalar */
document.querySelectorAll('nav button[data-p]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id===b.dataset.p));
 setTimeout(()=>map.invalidateSize(),80)});

/* arka plan: fotoğraf yoksa gradyan */
const G={acik:'#1e6fd9,#7fc4ff 60%,#cfe9ff',parcali:'#3a78c4,#9fbddc,#dfe7ef',bulutlu:'#3f4856,#7d8794,#aab2bc',sis:'#8a95a0,#b7c0c8,#d6dbe0',yagmur:'#232b37,#46515e,#6b7684',kar:'#6a7c93,#a9b8c9,#e6edf5',firtina:'#12141d,#2b2f40,#4a4f66',gece:'#04061a,#101a44,#2b2a5e'};
let curKey=null;
function setBg(k){
 if(k===curKey)return;curKey=k;
 const apply=css=>['bgG','bgH'].forEach(id=>{const o=$(id),n=document.createElement('div');n.className='l';n.style.cssText=css+';opacity:0';o.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.opacity=1;[...o.children].forEach(c=>{if(c!==n)setTimeout(()=>c.remove(),1500)})}))});
 const im=new Image();im.onload=()=>apply(`background-image:url(${k}.jpg)`);im.onerror=()=>apply(`background:linear-gradient(180deg,${G[k]})`);im.src=k+'.jpg';
 fx=k=='yagmur'||k=='firtina'?'rain':k=='kar'?'snow':'';storm=k=='firtina'}
const key=(c,day)=>{let k=c==0?'acik':c<=2?'parcali':c==3?'bulutlu':c<=48?'sis':(c<=67||(c>=80&&c<=82))?'yagmur':c<=86?'kar':'firtina';
 return(!day&&['acik','parcali','bulutlu','sis'].includes(k))?'gece':k};

/* yağmur, kar, şimşek */
const cv=$('fx'),cx=cv.getContext('2d');let fx='',storm=false,P=[],flash=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
 if(fx){while(P.length<(fx=='rain'?150:90))P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:.6+Math.random()});
  cx.strokeStyle='rgba(200,220,255,.45)';cx.fillStyle='rgba(255,255,255,.8)';cx.lineWidth=1;
  P.forEach(p=>{if(fx=='rain'){cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-3,p.y+14*p.s);cx.stroke();p.y+=14*p.s;p.x-=3*p.s*.3}
   else{cx.beginPath();cx.arc(p.x,p.y,1.2*p.s,0,7);cx.fill();p.y+=1.4*p.s;p.x+=Math.sin(p.y/40)*.5}
   if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width}})
  if(storm&&!flash&&Math.random()<.004)flash=1}else P=[];
 if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash*.35})`;cx.fillRect(0,0,cv.width,cv.height);flash-=.06;if(flash<0)flash=0}
 requestAnimationFrame(loop)})();

/* harita */
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([39,35],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
const halo=L.circleMarker([0,0],{radius:16,stroke:false,fillColor:'#f3c77a',fillOpacity:.25}).addTo(map);
const me=L.circleMarker([0,0],{radius:6,color:'#fff',weight:2,fillColor:'#f3c77a',fillOpacity:1}).addTo(map);
let follow=true;map.on('dragstart',()=>{follow=false;setTimeout(()=>follow=true,15000)});
new ResizeObserver(()=>map.invalidateSize()).observe($('map'));

/* konum */
let pos=null,lastW=0,lastC=null,alts=[],compassOn=false;
const dist=(a,b)=>{const r=Math.PI/180;return 6371*Math.hypot((b.lon-a.lon)*r*Math.cos((a.lat+b.lat)/2*r),(b.lat-a.lat)*r)};
navigator.geolocation.watchPosition(p=>{
 const c=p.coords;pos={lat:c.latitude,lon:c.longitude};
 $('lat').textContent=Math.abs(c.latitude).toFixed(5)+'° '+(c.latitude>=0?'K':'G');
 $('lon').textContent=Math.abs(c.longitude).toFixed(5)+'° '+(c.longitude>=0?'D':'B');
 if(c.altitude!=null){$('alt').textContent=Math.round(c.altitude);alts.push(c.altitude);if(alts.length>80)alts.shift();spark()}
 if(!compassOn&&c.heading!=null&&c.speed>1)setHeading(c.heading);
 me.setLatLng([c.latitude,c.longitude]);halo.setLatLng([c.latitude,c.longitude]);
 if(follow)map.setView([c.latitude,c.longitude],Math.max(map.getZoom(),13));
 if(Date.now()-lastW>600000)weather();
 if(!lastC||dist(lastC,pos)>3){lastC={...pos};city()}
},()=>{$('where').textContent='Konum izni ver'},{enableHighAccuracy:true,maximumAge:1000});
function spark(){if(alts.length<2)return;const mn=Math.min(...alts),mx=Math.max(...alts),s=Math.max(mx-mn,10);
 $('spark').setAttribute('points',alts.map((a,i)=>`${i/(alts.length-1)*100},${28-(a-mn)/s*26}`).join(' '))}
async function city(){try{const d=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=tr`)).json();
 $('where').textContent=[d.city||d.locality,d.principalSubdivision].filter(Boolean).join(', ')||'Konum bulundu'}catch(e){$('where').textContent='Konum bulundu'}}

/* hava */
const wc=c=>c==0?'Açık':c<=2?'Parçalı bulutlu':c==3?'Kapalı bulutlu':c<=48?'Sisli':c<=57?'Çiseleme':c<=67?'Yağmurlu':c<=77?'Karlı':c<=82?'Sağanak':c<=86?'Kar sağanağı':'Fırtına';
const cl='<path d="M18 46a9 9 0 010-18 13 13 0 0125-3 10 10 0 013 21z" fill="#e3e8ff"/>';
const sun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd166"/>`+[0,45,90,135,180,225,270,315].map(a=>`<line x1="${x}" y1="${y-r-3}" x2="${x}" y2="${y-r-7}" stroke="#ffd166" stroke-width="2.4" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`).join('');
const moon='<path d="M38 12a19 19 0 1018 25 15 15 0 01-18-25z" fill="#f4eecf"/>';
const ico=(c,day=true)=>c==0?(day?sun(32,32,10):moon):c<=2?(day?sun(24,22,8):moon.replace('M38 12','M30 8'))+cl:c==3?cl:c<=48?cl+'<path d="M16 52h32M22 57h20" stroke="#b6bdf0" stroke-width="2.4" stroke-linecap="round"/>'
 :(c<=67||(c>=80&&c<=82))?cl+'<path d="M24 50l-3 8M33 50l-3 8M42 50l-3 8" stroke="#6aa8ff" stroke-width="2.6" stroke-linecap="round"/>'
 :c<=86?cl+'<g fill="#fff"><circle cx="24" cy="54" r="2.2"/><circle cx="33" cy="57" r="2.2"/><circle cx="42" cy="54" r="2.2"/></g>'
 :cl+'<path d="M34 46l-6 9h6l-4 8" fill="none" stroke="#ffd166" stroke-width="2.8" stroke-linejoin="round"/>';
async function weather(){
 if(!pos)return;lastW=Date.now();
 try{const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,weather_code,surface_pressure,is_day&hourly=temperature_2m,weather_code&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=4&wind_speed_unit=kmh`)).json(),c=d.current,day=!!c.is_day;
  setBg(key(c.weather_code,day));
  $('cond').textContent=wc(c.weather_code);$('ic').innerHTML=ico(c.weather_code,day);
  $('note').textContent='Bugün en düşük sıcaklık '+Math.round(d.daily.temperature_2m_min[0])+'°, en yüksek '+Math.round(d.daily.temperature_2m_max[0])+'° olacak.';
  $('tmp').textContent=Math.round(c.temperature_2m)+'°';
  $('feel').textContent=Math.round(c.apparent_temperature)+'°';$('hum').textContent='%'+c.relative_humidity_2m;
  $('wnd').textContent=dirs[Math.round(c.wind_direction_10m/45)%8]+' '+Math.round(c.wind_speed_10m)+' km/s';
  $('prs').textContent=Math.round(c.surface_pressure)+' hPa';
  $('sun').textContent=d.daily.sunrise[0].slice(11,16)+' / '+d.daily.sunset[0].slice(11,16);
  const i=Math.max(0,d.hourly.time.findIndex(t=>t>=c.time.slice(0,13))),H=[0,1,2,3,4,5].map(k=>i+k*1);
  const v=H.map(k=>d.hourly.temperature_2m[k]),mn=Math.min(...v),mx=Math.max(...v),xy=v.map((t,k)=>[(k+.5)/6*600,50-(t-mn)/((mx-mn)||1)*40]);
  $('curve').setAttribute('d','M'+xy[0].join(',')+xy.slice(1).map((p,k)=>{const q=xy[k],m=(q[0]+p[0])/2;return` C${m},${q[1]} ${m},${p[1]} ${p[0]},${p[1]}`}).join(''));
  $('hrs').innerHTML=H.map(k=>`<div><b>${Math.round(d.hourly.temperature_2m[k])}°</b>${d.hourly.time[k].slice(11,16)}<br>${wc(d.hourly.weather_code[k])}</div>`).join('');
  $('days').innerHTML=[1,2,3].map(k=>`<div><svg viewBox="0 0 64 64">${ico(d.daily.weather_code[k])}</svg><span>${new Date(d.daily.time[k]).toLocaleDateString('tr-TR',{weekday:'long'})}<br>${wc(d.daily.weather_code[k])}</span><b>${Math.round(d.daily.temperature_2m_max[k])}° / ${Math.round(d.daily.temperature_2m_min[k])}°</b></div>`).join('');
 }catch(e){$('cond').textContent='Hava alınamadı'}}
setBg('bulutlu');

/* pusula */
let t='';for(let a=0;a<360;a+=15){const m=a%90==0,r=a*Math.PI/180,s=Math.sin(r),c=-Math.cos(r);
 t+=`<line x1="${s*(m?36:41)}" y1="${c*(m?36:41)}" x2="${s*45}" y2="${c*45}" stroke="rgba(255,255,255,${m?.7:.28})"/>`;
 if(m)t+=`<text x="${s*29}" y="${c*29+3}" text-anchor="middle" font-size="8" fill="#f6f4ff">${['K','D','G','B'][a/90]}</text>`}
$('dial').innerHTML=t;
function setHeading(h){$('dial').setAttribute('transform',`rotate(${-h})`);$('hdg').textContent=Math.round(h)+'° '+dirs[Math.round(h/45)%8]}
const onOri=e=>{const h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);if(h!=null){compassOn=true;setHeading(h)}};
let askedC=false;
async function askCompass(){try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!=='granted')return}catch(e){return}
 if(askedC)return;askedC=true;addEventListener('deviceorientationabsolute',onOri,true);addEventListener('deviceorientation',onOri,true)}
document.addEventListener('pointerdown',askCompass);askCompass();
</script>
</body>
</html>
