<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Kabin Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vh:1vh;--vw:1vw;
  --px:max(env(safe-area-inset-left),clamp(18px,calc(3*var(--vw)),40px));
  --bg:#000;
  --card:#1c1c1e;
  --line:rgba(255,255,255,.09);
  --red:#e5484d;
  --red-glow:rgba(229,72,77,.55);
  --tx:#f5f5f7;
  --tx2:rgba(245,245,247,.62);
  --tx3:rgba(245,245,247,.38);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;color:var(--tx);
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.bg-photo{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.3;z-index:0;transition:opacity .8s}
.bg-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.9) 70%,#000 100%)}

.screen{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(env(safe-area-inset-top),clamp(4px,calc(.8*var(--vh)),8px)) 0 max(env(safe-area-inset-bottom),clamp(8px,calc(1.6*var(--vh)),16px)) 0}

/* ÜST BAR — tarih ve saat aynı boyda, aynı hizada, yukarıya dayalı */
.top-bar{display:flex;align-items:flex-start;justify-content:center;position:relative;height:clamp(34px,calc(8*var(--vh)),58px);padding:0 var(--px);flex-shrink:0}
.loc{height:100%;display:inline-flex;align-items:center;gap:clamp(7px,calc(1.2*var(--vh)),10px);padding:0 8px;cursor:pointer}
.pin{width:clamp(18px,calc(3.2*var(--vh)),24px);height:clamp(18px,calc(3.2*var(--vh)),24px);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-text{font-size:clamp(13px,calc(2.5*var(--vh)),19px);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tx);
  max-width:calc(26*var(--vw));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-wrap{position:absolute;left:var(--px);top:0;height:100%;display:flex;align-items:center;gap:clamp(8px,calc(1.6*var(--vh)),14px)}
.date-wrap b{font-size:clamp(32px,calc(7.8*var(--vh)),58px);font-weight:800;letter-spacing:-.05em;line-height:1}
.date-r{display:flex;flex-direction:column;gap:clamp(3px,calc(.7*var(--vh)),6px)}
.date-r span{font-size:clamp(7.5px,calc(1.4*var(--vh)),10.5px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.date-r u{display:block;height:1px;background:rgba(245,245,247,.75)}
.clock{position:absolute;right:var(--px);top:0;height:100%;display:flex;align-items:center;font-size:clamp(32px,calc(7.8*var(--vh)),58px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@keyframes speedWarn{0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(229,72,77,.6)}50%{transform:scale(1.08);box-shadow:0 0 26px rgba(229,72,77,1)}}

/* ORTA — Sol: Hava | Orta: Harita (tam ortada) | Sağ: Pusula */
.middle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:center;gap:clamp(10px,calc(1.8*var(--vw)),26px);flex:1;min-height:0;padding:clamp(4px,calc(1*var(--vh)),10px) var(--px)}
.left{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(4px,calc(1*var(--vh)),10px);min-width:0}

.temp-row{display:inline-flex;align-items:center;gap:clamp(8px,calc(1.6*var(--vh)),14px);width:fit-content}
.temp{display:flex;line-height:.9}
.temp b{font-size:clamp(46px,calc(10.6*var(--vh)),84px);font-weight:700;letter-spacing:-.05em}
.temp sup{font-size:clamp(14px,calc(2.6*var(--vh)),22px);font-weight:500;color:var(--tx2);margin:clamp(6px,calc(1.2*var(--vh)),12px) 0 0 3px}

.wx-mini{height:clamp(44px,calc(10.2*var(--vh)),78px);width:clamp(50px,calc(11.6*var(--vh)),90px);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;--glow:rgba(243,178,59,.10)}
.wx-mini::before{content:'';position:absolute;inset:-20%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.wx-mini svg{position:relative;height:100%;width:auto;max-width:100%;display:block;overflow:visible;transition:transform .18s}

.cond{font-size:clamp(10px,calc(1.8*var(--vh)),14px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,245,247,.9)}
.metrics{display:grid;grid-template-columns:auto auto;gap:clamp(4px,calc(1*var(--vh)),9px) clamp(14px,calc(2*var(--vw)),26px);margin-top:clamp(2px,calc(.8*var(--vh)),8px);justify-content:start}
.metric{display:flex;flex-direction:column;gap:2px}
.metric span{display:inline-flex;align-items:center;gap:4px;font-size:clamp(7px,calc(1.15*var(--vh)),9px);color:var(--tx3);font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.metric b{font-size:clamp(12px,calc(1.9*var(--vh)),15px);font-weight:600;letter-spacing:.02em}

/* HARİTA — canvas mutlak konumlu: grid yüksekliğini bozmaz */
.road-wrap{position:relative;width:100%;align-self:stretch;min-height:0;overflow:hidden;cursor:pointer}
.road-cv{position:absolute;inset:0;width:100%;height:100%;display:block;
  -webkit-mask-image:radial-gradient(ellipse 52% 50% at 50% 54%,#000 60%,rgba(0,0,0,.5) 84%,transparent 100%);
  mask-image:radial-gradient(ellipse 52% 50% at 50% 54%,#000 60%,rgba(0,0,0,.5) 84%,transparent 100%)}
.road-hud{position:absolute;left:4px;bottom:4px;display:flex;flex-direction:column;gap:2px;pointer-events:none;z-index:3}
.road-badge{font-size:clamp(8px,calc(1.3*var(--vh)),10px);font-weight:600;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
.road-status{font-size:clamp(7px,calc(1.1*var(--vh)),8.5px);font-weight:600;letter-spacing:.14em;color:rgba(245,245,247,.28);text-transform:uppercase}

.spd-box{position:absolute;right:4px;bottom:2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;z-index:4}
.spd-sign{width:clamp(36px,calc(8.6*var(--vh)),60px);height:clamp(36px,calc(8.6*var(--vh)),60px);border-radius:50%;
  background:#f5f5f7;color:#0a0a0c;border:clamp(3.5px,calc(.82*var(--vh)),5.5px) solid var(--red);
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:clamp(13px,calc(3.1*var(--vh)),22px);letter-spacing:-.04em;line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.75);transition:background .2s,color .2s}
.spd-sign.unset{background:#0b0b0d;color:var(--tx2);border-color:rgba(229,72,77,.45)}
.spd-sign.warn{background:var(--red);color:#fff;border-color:#fff;animation:speedWarn .85s infinite}
.spd-cur{font-size:clamp(8px,calc(1.35*var(--vh)),10.5px);font-weight:600;letter-spacing:.08em;color:var(--tx2);font-variant-numeric:tabular-nums}
.spd-cur.warn{color:var(--red);font-weight:700}

/* PUSULA — sol blokla aynı dikey ortada */
.right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;align-self:center;gap:clamp(6px,calc(1.2*var(--vh)),10px);min-width:0}
.compass{height:clamp(110px,calc(33*var(--vh)),200px);aspect-ratio:1.2;border-radius:2px;background:#000;display:grid;grid-template-columns:1fr auto;
  padding:clamp(10px,calc(2.2*var(--vh)),18px) clamp(10px,calc(2*var(--vh)),16px) clamp(10px,calc(2.2*var(--vh)),18px) clamp(8px,calc(1.6*var(--vh)),14px);cursor:pointer;flex-shrink:0}
.c-left{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:0;gap:2px}
.alt{font-size:clamp(24px,calc(6.8*var(--vh)),54px);font-weight:700;letter-spacing:-.05em;line-height:1}
.alt-l{font-size:clamp(6.5px,calc(1.25*var(--vh)),9.5px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.4;color:var(--tx2)}
.tape{position:relative;width:clamp(54px,calc(13*var(--vh)),96px)}
.t-in{position:absolute;inset:3px 0}
.ticks{position:absolute;left:0;top:0;bottom:0;width:clamp(22px,calc(5.4*var(--vh)),42px)}
.ticks i{position:absolute;left:0;right:0;height:1px;background:rgba(245,245,247,.9)}
.letter{position:absolute;right:0;font-size:clamp(14px,calc(3.6*var(--vh)),28px);font-weight:700;line-height:1;transform:translateY(-50%)}
.letter.top{top:0}.letter.bot{top:100%}
.mk{position:absolute;left:-6px;width:clamp(32px,calc(7.6*var(--vh)),56px);height:clamp(2.5px,calc(.55*var(--vh)),4.5px);border-radius:3px;background:var(--red);box-shadow:0 0 8px var(--red-glow);transform:translateY(-50%)}
.mk-l{position:absolute;right:0;font-size:clamp(10px,calc(2.3*var(--vh)),16px);font-weight:600;transform:translateY(-50%)}
.live-coords{display:flex;align-items:center;gap:clamp(7px,calc(1.2*var(--vh)),11px);font-size:clamp(8px,calc(1.5*var(--vh)),11px);font-weight:600;letter-spacing:.1em;white-space:nowrap;color:var(--tx)}
.live-coords i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 2s infinite}

/* SAATLİK */
.hourly{width:100%;display:flex;align-items:center;min-height:clamp(74px,calc(14.5*var(--vh)),102px);margin-bottom:clamp(10px,calc(1.8*var(--vh)),16px);padding:0 var(--px);flex-shrink:0}
.wave{width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.w-row{width:100%;display:grid;grid-template-columns:repeat(8,1fr);text-align:center}
.h-t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(11.5px,calc(1.8*var(--vh)),14px);font-weight:500;color:var(--tx2)}
.h-t.on{color:var(--tx);font-weight:700}
.h-dot{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);opacity:0}.h-t.on .h-dot{opacity:1}
.w-line{width:100%;height:clamp(16px,calc(3.2*var(--vh)),26px)}.w-line svg{width:100%;height:100%;display:block;overflow:visible}
.h-h{display:flex;flex-direction:column;align-items:center;gap:2px}
.h-h span{font-size:clamp(8.5px,calc(1.25*var(--vh)),10.5px);font-weight:600;letter-spacing:.08em;color:var(--tx3);padding:1.5px 7px;border-radius:6px}
.h-h.on span{background:rgba(255,255,255,.09);color:var(--tx)}
.h-p{font-size:clamp(9px,calc(1.4*var(--vh)),11px);color:#7fb7ff;font-weight:600;display:flex;align-items:center;gap:3px}
.h-p.lo{opacity:.4}.h-p.hi{color:var(--red);text-shadow:0 0 8px var(--red-glow)}

/* RADYO — şarkı yazısı aşağıda, ekolayzır alçak */
.dock{width:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0;height:clamp(74px,calc(15.5*var(--vh)),96px)}
.player{width:100%;height:100%;background:#000;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,calc(2.6*var(--vh)),22px) var(--px) 0 var(--px)}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.p-meta{flex:1;min-width:0;font-size:clamp(12px,calc(2*var(--vh)),14.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-song{color:#f2f2f4;font-weight:600;letter-spacing:.01em}
.p-sep{color:rgba(242,242,244,.5);font-weight:400;margin:0 7px}
.p-chan{color:rgba(242,242,244,.7);font-weight:500;font-size:.82em;letter-spacing:.14em;text-transform:uppercase}
.p-ctrls{display:flex;align-items:center;gap:clamp(10px,calc(1.6*var(--vw)),18px);flex-shrink:0}
.play{width:clamp(24px,calc(4.2*var(--vh)),32px);height:clamp(24px,calc(4.2*var(--vh)),32px);color:#d97724;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,filter .15s}
.play:active{transform:scale(.9);filter:brightness(1.2)}
.play svg{width:100%;height:100%}
.nxt{width:clamp(20px,calc(3.4*var(--vh)),26px);height:clamp(20px,calc(3.4*var(--vh)),26px);color:rgba(242,242,244,.65);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,color .15s}
.nxt:active{transform:scale(.9);color:#fff}
.nxt svg{width:100%;height:100%}
.eq{display:block;width:100%;height:clamp(14px,calc(3*var(--vh)),22px)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.panel{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font-size:14px;outline:none}
.res{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto}
.opt{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;cursor:pointer}
.opt:active{background:rgba(229,72,77,.25)}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen>header,.screen>main,.screen>section,.screen>footer{position:relative;z-index:2}
.toast{position:absolute;left:50%;top:calc(12*var(--vh));transform:translateX(-50%);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>

<input type="file" id="mp3Input" accept="audio/*" multiple />
<input type="file" id="photoInput" accept="image/*" multiple />
<audio id="audioTag" preload="none"></audio>
<span id="gpsText" hidden></span>
<div id="barTrack" hidden><i id="barFill"></i></div>

<div class="screen">
<div id="bgPhoto" class="bg-photo"></div>
<div class="bg-vignette"></div>
  <header class="top-bar">
    <div class="date-wrap">
      <b id="bigDay">--</b>
      <div class="date-r"><span id="dayLine"></span><u></u><span id="monthLine"></span></div>
    </div>
    <div class="clock" id="clockT">--:--</div>
    <div class="loc" onclick="openCity()">
      <span class="pin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="1.9" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <span class="loc-text" id="locText">Konum alınıyor</span>
    </div>
  </header>

  <main class="middle">
    <section class="left">
      <div class="temp-row">
        <div class="temp"><b id="mainTemp">--</b><sup>°c</sup></div>
        <div class="wx-mini" id="art"></div>
      </div>
      <div class="cond" id="mainCond">Yükleniyor</div>
      <div class="metrics">
        <div class="metric"><span>Rüzgar</span><b id="windText">--</b></div>
        <div class="metric"><span>Nem</span><b id="humText">--</b></div>
        <div class="metric"><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0M2 18h20M12 10V2M9 5l3-3 3 3"/></svg> Gün doğumu</span><b id="sunUp">--:--</b></div>
        <div class="metric"><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0M2 18h20M12 2v8M9 7l3 3 3-3"/></svg> Gün batımı</span><b id="sunDown">--:--</b></div>
      </div>
    </section>

    <section class="road-wrap" id="roadWrap" onclick="handleRoadTap()">
      <canvas class="road-cv" id="roadCanvas"></canvas>
      <div class="road-hud">
        <span class="road-badge" id="roadZoomLbl">100 M</span>
        <span class="road-status" id="roadStatus"></span>
      </div>
      <div class="spd-box" id="spdBox" onclick="event.stopPropagation();toggleSpeedAudio()">
        <div class="spd-sign unset" id="spdSign"><span id="spdLimit">--</span></div>
        <div class="spd-cur" id="spdCur">-- km/sa</div>
      </div>
    </section>

    <section class="right">
      <div class="compass" id="compass" onclick="startCompass()">
        <div class="c-left"><div class="alt" id="altVal">--</div><div class="alt-l">deniz seviyesinden<br>metre</div></div>
        <div class="tape"><div class="t-in" id="tapeIn">
          <div class="ticks" id="ticks"></div>
          <span class="letter top" id="cTop">N</span><span class="letter bot" id="cBot">E</span>
          <div class="mk" id="mk" style="top:50%"></div><span class="mk-l" id="mkL" style="top:50%">dokun</span>
        </div></div>
      </div>
      <div class="live-coords"><i></i><span id="latDms">--</span><span id="lonDms">--</span></div>
    </section>
  </main>

  <section class="hourly">
    <div class="wave">
      <div class="w-row" id="wTemps"></div>
      <div class="w-line"><svg viewBox="0 0 800 28" preserveAspectRatio="none"><path id="wPath" d="M 0 14 L 800 14" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="1.4"/></svg></div>
      <div class="w-row" id="wHours"></div>
    </div>
  </section>

  <footer class="dock">
    <div class="player">
      <div class="p-top">
        <div class="p-meta"><span class="p-song" id="songLabel"></span><span class="p-sep">-</span><span class="p-chan" id="artistLabel"></span></div>
        <div class="p-ctrls">
          <button class="play" aria-label="Oynat / duraklat" onclick="togglePlay()"><svg id="ppSvg" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></button>
          <button class="nxt" aria-label="Sonraki kanal" onclick="nextSong()"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="4 5 15 12 4 19"/><rect x="17" y="5" width="2.5" height="14" rx="1"/></svg></button>
        </div>
      </div>
      <canvas class="eq" id="eq"></canvas>
    </div>
  </footer>
<div class="modal" id="cityModal" onclick="closeCity()">
  <div class="panel" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-size:14px;font-weight:500">Konum seç</strong>
      <button onclick="forceGps();closeCity()" style="border:1px solid var(--red);color:var(--red);padding:5px 12px;border-radius:9px;font-size:12px">GPS'e dön</button>
    </div>
    <input id="cityInput" class="search" placeholder="Şehir yazın (Bolu, Ankara, Edirne…)" />
    <div class="res" id="cityRes"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
</div>


<script>
const $ = id => document.getElementById(id);

/* ---------- ARKA PLAN FOTOĞRAFLARI ---------- */
const BG_FILES = ["arka-plan-1.jpg","arka-plan-2.jpg","arka-plan-3.jpg"];
let bgList = [], bgIdx = 0;
BG_FILES.forEach(f => { const i = new Image(); i.onload = () => { bgList.push(`url("${f}")`); if (bgList.length === 1) $('bgPhoto').style.backgroundImage = bgList[0]; }; i.src = f; });
function switchBg(){ if (bgList.length){ bgIdx = (bgIdx+1)%bgList.length; $('bgPhoto').style.backgroundImage = bgList[bgIdx]; } else $('photoInput').click(); }
$('photoInput').addEventListener('change', e => {
  const fs = [...e.target.files]; if (!fs.length) return;
  bgList = fs.map(f => `url("${URL.createObjectURL(f)}")`); bgIdx = 0; $('bgPhoto').style.backgroundImage = bgList[0];
});

/* ---------- HAVA DURUMU ÇİZGİ İKONLARI ---------- */
const C_CLOSED = "M 74 128 A 26 26 0 1 1 80.4 76.8 A 38 38 0 0 1 156.0 80.1 A 24 24 0 1 1 154 128 Z";
const C_OPEN   = "M 92 128 L 74 128 A 26 26 0 1 1 80.4 76.8 A 38 38 0 0 1 156.0 80.1 A 24 24 0 1 1 154 128 L 136 128";
const cloudClosed = (tr="") => `<path d="${C_CLOSED}" fill="#000" stroke="#f5f5f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="${tr}"/>`;
const cloudOpen   = (tr="") => `<g transform="${tr}"><path d="${C_CLOSED}" fill="#000" stroke="none"/><path d="${C_OPEN}" fill="none" stroke="#f5f5f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></g>`;

function sunLines(cx, cy, r, r1, r2, sw=6.5){
  let rays = "";
  for (let i=0; i<8; i++){
    const a = i * Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a);
    rays += `<line x1="${(cx+r1*ca).toFixed(1)}" y1="${(cy+r1*sa).toFixed(1)}" x2="${(cx+r2*ca).toFixed(1)}" y2="${(cy+r2*sa).toFixed(1)}"/>`;
  }
  return `<g stroke="#f3b23b" stroke-width="${sw}" stroke-linecap="round" fill="none"><circle cx="${cx}" cy="${cy}" r="${r}"/>${rays}</g>`;
}
function moonLines(cx, cy, s=1){
  return `<g transform="translate(${cx},${cy}) scale(${s})" stroke="#f3b23b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="#000">`+
    `<path d="M 6 -27.3 A 28 28 0 1 0 27.3 6 A 22 22 0 0 1 6 -27.3 Z"/>`+
    `<path d="M 16 -21 v 10 M 11 -16 h 10" stroke-width="4.5"/></g>`;
}
function bigSnowflake(cx, cy){
  let g = "";
  for (let i=0; i<6; i++){
    g += `<g transform="rotate(${i*60} ${cx} ${cy})">`+
         `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-46}"/>`+
         `<polyline points="${cx-11},${cy-35} ${cx},${cy-25} ${cx+11},${cy-35}"/>`+
         `</g>`;
  }
  return `<g stroke="#63a7cf" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">${g}</g>`;
}

function wx(code){
  if (code===0) return {label:"Açık ve güneşli", type:"sun"};
  if (code===1) return {label:"Az bulutlu", type:"msunny"};
  if (code===2) return {label:"Parçalı bulutlu", type:"pcloud"};
  if (code===3) return {label:"Çok bulutlu", type:"cloud"};
  if ([45,48].includes(code)) return {label:"Sisli", type:"fog"};
  if ([51,53,55,61,80].includes(code)) return {label:"Hafif yağmurlu", type:"crain"};
  if ([63,65,81,82].includes(code)) return {label:"Yağmurlu", type:"rain"};
  if ([56,57,66,67].includes(code)) return {label:"Sulu kar", type:"sleet"};
  if ([71,77,85].includes(code)) return {label:"Hafif kar yağışlı", type:"csnow"};
  if ([73,75,86].includes(code)) return {label:"Kar yağışlı", type:"snow"};
  if (code===95) return {label:"Gök gürültülü fırtına", type:"ctstorm"};
  if ([96,99].includes(code)) return {label:"Fırtına ve sağanak", type:"tstorm"};
  return {label:"Bulutlu", type:"cloud"};
}

/* ---------- KUŞBAKIŞI BEYAZ ÇİZGİ HARİTA ---------- */
const roadCv = $('roadCanvas'), rctx = roadCv.getContext('2d');
const ZOOM_STEPS = [
  { meters: 100, label: '100 M' },
  { meters: 250, label: '250 M' },
  { meters: 500, label: '500 M' }
];
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
let zoomIdx = 0;
let roadWays = [], roadFetchLat = null, roadFetchLon = null, roadFetchAt = 0, roadLastTryAt = 0, roadLoading = false, roadLoadStart = 0, roadRetryTimer = null;
let targetLat = null, targetLon = null, renderLat = null, renderLon = null;
let curSpeedKmh = null, targetHeading = 0, renderHeading = 0, roadAnimRaf = null;
let activeLimit = null, speedAudioOn = true, lastBeepAt = 0, wasOver = false, audioCtx = null;

function roadSize(){
  const dp = window.devicePixelRatio || 1;
  roadCv.width = Math.max(1, Math.round(roadCv.clientWidth * dp));
  roadCv.height = Math.max(1, Math.round(roadCv.clientHeight * dp));
  drawRoadMap();
}
function kickRoadAnim(){
  if (!roadAnimRaf) roadAnimRaf = requestAnimationFrame(stepRoadAnim);
}
function stepRoadAnim(){
  roadAnimRaf = null;
  if (targetLat === null || targetLon === null) return;
  if (renderLat === null){ renderLat = targetLat; renderLon = targetLon; renderHeading = targetHeading; drawRoadMap(); return; }

  const dLat = targetLat - renderLat, dLon = targetLon - renderLon;
  const dHead = ((targetHeading - renderHeading + 540) % 360) - 180;
  const moving = Math.abs(dLat) > 1e-7 || Math.abs(dLon) > 1e-7 || Math.abs(dHead) > 0.25;

  if (moving){
    renderLat += dLat * 0.22;
    renderLon += dLon * 0.22;
    renderHeading = (renderHeading + dHead * 0.22 + 360) % 360;
    drawRoadMap();
    roadAnimRaf = requestAnimationFrame(stepRoadAnim);
  } else {
    renderLat = targetLat;
    renderLon = targetLon;
    renderHeading = targetHeading;
    drawRoadMap();
  }
}

function handleRoadTap(){
  if (!roadWays.length && targetLat !== null && targetLon !== null){
    fetchRoadNetwork(targetLat, targetLon, true);
    toast('Yol yenileniyor…');
    return;
  }
  zoomIdx = (zoomIdx + 1) % ZOOM_STEPS.length;
  $('roadZoomLbl').textContent = ZOOM_STEPS[zoomIdx].label;
  drawRoadMap();
  toast('Görüş: ' + ZOOM_STEPS[zoomIdx].label);
}
function toggleSpeedAudio(){
  speedAudioOn = !speedAudioOn;
  if (speedAudioOn) ensureAudioCtx();
  toast(speedAudioOn ? 'Hız uyarısı: Açık' : 'Hız uyarısı: Sessiz');
}
function ensureAudioCtx(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch{ return null; }
}
function playSpeedChime(){
  if (!speedAudioOn) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  try{
    const now = ctx.currentTime;
    [880, 659.25].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.14);
      gain.gain.setValueAtTime(0.001, now + idx * 0.14);
      gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.14 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + idx * 0.14);
      osc.stop(now + idx * 0.14 + 0.24);
    });
  }catch{}
}

function parseMaxSpeed(tags){
  if (!tags) return null;
  const raw = tags.maxspeed || tags['maxspeed:forward'] || '';
  if (!raw) return null;
  const s = String(raw).trim().toLowerCase();
  if (s.includes('urban')) return 50;
  if (s.includes('rural')) return 90;
  if (s.includes('motorway')) return 130;
  const m = s.match(/(\d+)/);
  if (!m) return null;
  let val = parseInt(m[1], 10);
  if (s.includes('mph')) val = Math.round(val * 1.60934);
  return (val >= 10 && val <= 160) ? val : null;
}

/* İlk başarılı cevabı döndürür (Promise.any yerine, eski Safari'de de çalışır) */
function firstOk(list){
  return new Promise((resolve, reject) => {
    let left = list.length;
    list.forEach(p => p.then(resolve, () => { if (--left === 0) reject(new Error('hepsi başarısız')); }));
  });
}

async function fetchRoadNetwork(lat, lon, force=false){
  if (lat == null || lon == null) return;
  const now = Date.now();
  const moved = roadFetchLat !== null ? distKm(roadFetchLat, roadFetchLon, lat, lon) : 99;
  if (!force && roadWays.length && moved < 1.0 && now - roadFetchAt < 180000) return;
  if (roadLoading && now - roadLoadStart < 20000) return;       // takılı kalmaya karşı kilit 20 sn'de açılır
  if (!force && now - roadLastTryAt < 8000) return;

  clearTimeout(roadRetryTimer);
  roadLoading = true;
  roadLoadStart = now;
  roadLastTryAt = now;
  if (!roadWays.length) $('roadStatus').textContent = 'YÜKLENİYOR';

  // Ana yollar (~2 km yarıçap)
  const cosLat = Math.max(0.2, Math.cos(lat * Math.PI / 180));
  const dLat = 0.018, dLon = dLat / cosLat;
  const box = `${(lat-dLat).toFixed(5)},${(lon-dLon).toFixed(5)},${(lat+dLat).toFixed(5)},${(lon+dLon).toFixed(5)}`;
  const q = `[out:json][timeout:20];way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link)$"](${box});out body geom;`;

  const ctrls = OVERPASS.map(() => new AbortController());
  const killer = setTimeout(() => ctrls.forEach(c => c.abort()), 16000);

  try{
    // Üç sunucuya aynı anda sor, ilk geçerli cevabı kullan
    const data = await firstOk(OVERPASS.map((ep, i) =>
      fetch(`${ep}?data=${encodeURIComponent(q)}`, { signal: ctrls[i].signal })
        .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(d => {
          if (!d || !Array.isArray(d.elements)) throw new Error('bozuk cevap');
          if (!d.elements.length && d.remark) throw new Error('sunucu zaman aşımı');
          return d;
        })
    ));
    ctrls.forEach(c => c.abort());

    roadWays = data.elements
      .filter(el => el.type === 'way' && Array.isArray(el.geometry) && el.geometry.length >= 2)
      .map(el => ({
        id: el.id,
        hw: (el.tags && el.tags.highway) || '',
        ref: (el.tags && el.tags.ref) || '',
        name: (el.tags && el.tags.name) || '',
        limit: parseMaxSpeed(el.tags),
        pts: el.geometry.map(g => [g.lat, g.lon])
      }));

    roadFetchLat = lat;
    roadFetchLon = lon;
    roadFetchAt = Date.now();
    $('roadStatus').textContent = roadWays.length ? '' : 'ANA YOL YOK';
    drawRoadMap();
  }catch{
    if (!roadWays.length) $('roadStatus').textContent = 'YENİDEN DENENİYOR';
    roadRetryTimer = setTimeout(() => {
      if (targetLat !== null && targetLon !== null) fetchRoadNetwork(targetLat, targetLon, true);
    }, 8000);
  }finally{
    clearTimeout(killer);
    roadLoading = false;
  }
}

function ptSegDistSq(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq > 0 ? ((px - ax)*dx + (py - ay)*dy) / lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return (px - cx)*(px - cx) + (py - cy)*(py - cy);
}

function updateSpeedUI(){
  const signEl = $('spdSign'), limEl = $('spdLimit'), curEl = $('spdCur');
  if (activeLimit !== null){
    limEl.textContent = activeLimit;
    signEl.classList.remove('unset');
  } else {
    limEl.textContent = '--';
    signEl.classList.add('unset');
  }

  if (curSpeedKmh !== null && isFinite(curSpeedKmh)){
    curEl.textContent = `${curSpeedKmh} km/sa`;
  } else {
    curEl.textContent = `-- km/sa`;
  }

  const isOver = (activeLimit !== null && curSpeedKmh !== null && curSpeedKmh > activeLimit + 2);
  signEl.classList.toggle('warn', isOver);
  curEl.classList.toggle('warn', isOver);

  if (isOver){
    const now = Date.now();
    if (!wasOver || now - lastBeepAt > 25000){
      lastBeepAt = now;
      playSpeedChime();
    }
  }
  wasOver = isOver;
}

function drawRoadMap(){
  const w = roadCv.width, h = roadCv.height;
  if (!w || !h) return;
  const dp = window.devicePixelRatio || 1;
  rctx.clearRect(0, 0, w, h);

  // Ok alt-ortada konumlanır
  const tx = w * 0.5, ty = h * 0.78;

  if (renderLat === null || renderLon === null){
    rctx.fillStyle = 'rgba(245,245,247,.25)';
    rctx.beginPath();
    rctx.arc(tx, ty, 4 * dp, 0, Math.PI * 2);
    rctx.fill();
    return;
  }

  const cosLat = Math.cos(renderLat * Math.PI / 180);
  const mPerDegLat = 110540;
  const mPerDegLon = 111320 * cosLat;
  const zoomMeters = ZOOM_STEPS[zoomIdx].meters;
  const pxPerMeter = (h * 0.78) / zoomMeters;

  // Yolları metreye çevir, en yakınını bul
  let bestWay = null, bestDistSq = Infinity;
  const projWays = roadWays.map(way => {
    const mpts = way.pts.map(([la, lo]) => [
      (lo - renderLon) * mPerDegLon,
      (la - renderLat) * mPerDegLat
    ]);
    let minD = Infinity;
    for (let i = 0; i < mpts.length - 1; i++){
      const d = ptSegDistSq(0, 0, mpts[i][0], mpts[i][1], mpts[i+1][0], mpts[i+1][1]);
      if (d < minD) minD = d;
    }
    if (minD < bestDistSq){
      bestDistSq = minD;
      bestWay = { way, mpts, minD };
    }
    return { way, mpts, minD };
  });

  const matchRadius = manual ? 450 : 120;
  const matched = bestWay && bestDistSq <= matchRadius * matchRadius ? bestWay.way : null;
  let foundLimit = matched ? matched.limit : null;
  if (matched && foundLimit === null){
    for (const item of projWays){
      if (item.way.limit !== null && item.minD < 400 * 400){
        if ((matched.ref && item.way.ref === matched.ref) || (matched.name && item.way.name === matched.name)){
          foundLimit = item.way.limit;
          break;
        }
      }
    }
  }
  activeLimit = foundLimit;
  updateSpeedUI();

  const isActiveWay = (way) => {
    if (!matched) return false;
    if (way.id === matched.id) return true;
    if (matched.ref && way.ref === matched.ref) return true;
    if (matched.name && way.name === matched.name && way.hw === matched.hw) return true;
    return false;
  };

  rctx.save();
  rctx.translate(tx, ty);
  rctx.rotate(-renderHeading * Math.PI / 180);
  rctx.lineCap = 'round';
  rctx.lineJoin = 'round';

  // 1. Katman: çevredeki diğer ana yollar — görüş alanı boyunca ince, soluk beyaz
  const rView = zoomMeters * pxPerMeter;
  const connGrad = rctx.createRadialGradient(0, 0, rView * 0.2, 0, 0, rView * 1.05);
  connGrad.addColorStop(0, 'rgba(255,255,255,0.50)');
  connGrad.addColorStop(0.6, 'rgba(255,255,255,0.34)');
  connGrad.addColorStop(1, 'rgba(255,255,255,0)');

  const viewSq = (zoomMeters * 1.3) * (zoomMeters * 1.3);
  rctx.strokeStyle = connGrad;
  rctx.lineWidth = 1.35 * dp;
  rctx.beginPath();
  for (const { way, mpts, minD } of projWays){
    if (isActiveWay(way) || minD > viewSq) continue;
    for (let i = 0; i < mpts.length; i++){
      const x = mpts[i][0] * pxPerMeter, y = -mpts[i][1] * pxPerMeter;
      if (i === 0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
    }
  }
  rctx.stroke();

  // 2. Katman: üzerinde gidilen ana güzergah
  if (matched){
    const activeWays = projWays.filter(item => isActiveWay(item.way));

    // Sert viraj (35° üzeri, 115 m içinde) için kırmızı vurgu
    const rad = renderHeading * Math.PI / 180;
    const cosH = Math.cos(rad), sinH = Math.sin(rad);
    for (const { mpts } of activeWays){
      for (let i = 1; i < mpts.length - 1; i++){
        const ax = mpts[i][0] - mpts[i-1][0], ay = mpts[i][1] - mpts[i-1][1];
        const bx = mpts[i+1][0] - mpts[i][0], by = mpts[i+1][1] - mpts[i][1];
        const lenA = Math.hypot(ax, ay), lenB = Math.hypot(bx, by);
        if (lenA < 4 || lenB < 4) continue;
        const dot = (ax*bx + ay*by) / (lenA * lenB);
        const turnDeg = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;
        if (turnDeg >= 35){
          const fwd = mpts[i][0] * sinH + mpts[i][1] * cosH;
          const dist = Math.hypot(mpts[i][0], mpts[i][1]);
          if (fwd > -10 && dist <= 115){
            rctx.save();
            rctx.strokeStyle = 'rgba(229,72,77,0.75)';
            rctx.shadowColor = 'rgba(229,72,77,0.9)';
            rctx.shadowBlur = 12 * dp;
            rctx.lineWidth = 5.2 * dp;
            rctx.beginPath();
            rctx.moveTo(mpts[i-1][0] * pxPerMeter, -mpts[i-1][1] * pxPerMeter);
            rctx.lineTo(mpts[i][0] * pxPerMeter, -mpts[i][1] * pxPerMeter);
            rctx.lineTo(mpts[i+1][0] * pxPerMeter, -mpts[i+1][1] * pxPerMeter);
            rctx.stroke();
            rctx.restore();
          }
        }
      }
    }

    rctx.save();
    rctx.strokeStyle = '#ffffff';
    rctx.lineWidth = 3.6 * dp;
    rctx.shadowColor = 'rgba(255,255,255,0.45)';
    rctx.shadowBlur = 8 * dp;
    rctx.beginPath();
    for (const { mpts } of activeWays){
      for (let i = 0; i < mpts.length; i++){
        const x = mpts[i][0] * pxPerMeter, y = -mpts[i][1] * pxPerMeter;
        if (i === 0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
      }
    }
    rctx.stroke();
    rctx.restore();
  }

  rctx.restore();

  // Araç konum oku (her zaman yukarı bakar)
  rctx.save();
  rctx.translate(tx, ty);
  rctx.fillStyle = 'rgba(229,72,77,0.22)';
  rctx.beginPath();
  rctx.arc(0, 0, 11 * dp, 0, Math.PI * 2);
  rctx.fill();

  rctx.fillStyle = '#e5484d';
  rctx.strokeStyle = '#ffffff';
  rctx.lineWidth = 1.5 * dp;
  rctx.beginPath();
  rctx.moveTo(0, -6.5 * dp);
  rctx.lineTo(5 * dp, 5 * dp);

const KM_TH = 3, T_TH = 3*60*1000;
let lastLat=null,lastLon=null,lastFetch=0,manual=false;
function distKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
async function placeName(lat,lon){
  try{
    const d = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=tr`)).json();
    const a=d.locality||d.city||"", p=d.principalSubdivision||"";
    if (a && p && a!==p) return `${a}, ${p}`;
    return p ? `${p}, ${d.countryName||''}` : (a||"GPS konumu");
  }catch{ return "GPS konumu"; }
}
async function onCoords(lat,lon,force){
  const now=Date.now(), moved = lastLat!==null ? distKm(lastLat,lastLon,lat,lon) : 0;
  if (force || lastLat===null || moved>=KM_TH || now-lastFetch>=T_TH){
    lastLat=lat; lastLon=lon; lastFetch=now;
    fetchWeather(lat,lon,await placeName(lat,lon));
  }
}

  if (!('geolocation' in navigator)) return ipFallback();

    () => { if (lastLat===null && targetLat===null) ipFallback(); }, {enableHighAccuracy:true,maximumAge:4000,timeout:10000});
  setInterval(() => { if (!manual) navigator.geolocation.getCurrentPosition(p => { updateGeo(p.coords); onCoords(p.coords.latitude,p.coords.longitude,false); }, ()=>{}, {enableHighAccuracy:true,timeout:8000}); }, T_TH);
}
function forceGps(){

function cleanTrackTitle(raw, stationName){
  if (!raw) return "";
  const s = String(raw).replace(/\s+/g,' ').trim();
  if (!s || s.length < 2) return "";
  const low = s.toLowerCase();
  if (low === "unknown" || low === "-" || low === stationName.toLowerCase()) return "";
  return s;
}
async function readIcyTitle(url, signal){
  const res = await fetch(url, { headers: { 'Icy-MetaData': '1' }, signal });
  const metaint = parseInt(res.headers.get('icy-metaint'), 10);
  if (!metaint || isNaN(metaint) || !res.body) return "";
  const reader = res.body.getReader();
  let buf = new Uint8Array(0);
  while (true){
    const { value, done } = await reader.read();
    if (done || !value) break;
    const next = new Uint8Array(buf.length + value.length);
    next.set(buf); next.set(value, buf.length); buf = next;
    if (buf.length >= metaint + 1){
      const metaLen = buf[metaint] * 16;
      if (metaLen === 0) break;
      if (buf.length >= metaint + 1 + metaLen){
        const raw = new TextDecoder('utf-8').decode(buf.slice(metaint + 1, metaint + 1 + metaLen));
        const m = raw.match(/StreamTitle='(.*?)';/i) || raw.match(/StreamTitle='([^']*)'/i);
        return m ? m[1] : "";
      }
    }
    if (buf.length > metaint + 8192) break;
  }
  return "";
}
async function fetchNowPlaying(){

      if (d && (d.artist || d.title)) found = [d.artist, d.title].filter(Boolean).join(" - ");

/* ---------- EKOLAYZIR (alçak) ---------- */
const eq=$('eq'), ectx=eq.getContext('2d'), NB=96, bars=new Float32Array(NB); let eqRaf=null;
const EQ_MAX = 0.62; // yükseklik sınırı
function eqSize(){ const dp=window.devicePixelRatio||1; eq.width=Math.max(1,eq.clientWidth*dp); eq.height=Math.max(1,eq.clientHeight*dp); }
function eqFrame(ts){
  const w=eq.width, h=eq.height, t=ts/1000, dp=window.devicePixelRatio||1;
  const bw=Math.max(1.5*dp, (w/NB)*0.34), step=(w-bw)/(NB-1);
  let mx=0;
  ectx.clearRect(0,0,w,h);
  ectx.lineCap='butt';
  ectx.lineWidth=bw;
  for (let i=0;i<NB;i++){
    const c=i/(NB-1);
    const leftBias=0.14 + 0.86*Math.exp(-Math.pow((c-0.26)/0.24,2)) + 0.35*Math.exp(-Math.pow((c-0.05)/0.07,2));
    const w1=Math.abs(Math.sin(t*2.1 + i*0.52));
    const w2=Math.abs(Math.sin(t*1.35 - i*0.21 + 1.1));
    const w3=0.5 + 0.5*Math.sin(t*3.7 + i*1.17);
    const tg=playing ? Math.min(1, (0.08 + 0.92*(w1*w2*0.75 + w3*0.25))*leftBias) * EQ_MAX : 0;
    bars[i]+=(tg-bars[i])*(tg>bars[i]?0.42:0.14);
    mx=Math.max(mx,bars[i]);
    const bh=Math.max(2*dp, bars[i]*(h - 2*dp));
    const x=bw/2 + i*step;
    ectx.strokeStyle=bars[i]<0.08 ? 'rgba(242,242,244,.38)' : 'rgba(242,242,244,.88)';
    ectx.beginPath();
    ectx.moveTo(x, h);
    ectx.lineTo(x, h - bh);
    ectx.stroke();
  }
  eqRaf=(playing||mx>.01)?requestAnimationFrame(eqFrame):null;
}
function eqKick(){ if(!eqRaf) eqRaf=requestAnimationFrame(eqFrame); }

    document.documentElement.style.removeProperty('--px');
  }
  document.documentElement.style.setProperty('--vh',h/100+'px');
  document.documentElement.style.setProperty('--vw',w/100+'px');
  eqSize(); eqKick(); roadSize();
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }
let lastTap=0;
document.querySelector('.date-wrap').addEventListener('click',()=>{
  const n=Date.now(); if (n-lastTap<400){
    const m=modes[(modes.indexOf(getMode())+1)%modes.length]; try{ localStorage.setItem('rot',m); }catch{}
    applyLayout(); toast(modeNames[m]); lastTap=0;
  } else lastTap=n;
});
addEventListener('resize',applyLayout); addEventListener('orientationchange',()=>setTimeout(applyLayout,150));
$('roadZoomLbl').textContent = ZOOM_STEPS[zoomIdx].label;
applyLayout();
ui(); startGps();
</script>
</body>
</html>
