<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Kabin Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --card:#1c1c1e;
  --card-hi:#262628;
  --line:rgba(255,255,255,.09);
  --red:#e5484d;
  --red-glow:rgba(229,72,77,.5);
  --tx:#f5f5f7;
  --tx2:rgba(245,245,247,.62);
  --tx3:rgba(245,245,247,.38);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;color:var(--tx);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  font-feature-settings:'tnum' 1,'cv05' 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.bg-photo{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.3;z-index:0;transition:opacity .8s}
.bg-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.9) 70%,#000 100%)}

.screen{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(env(safe-area-inset-top),clamp(8px,1.6vh,16px)) max(env(safe-area-inset-right),clamp(18px,3vw,40px))
          max(env(safe-area-inset-bottom),clamp(8px,1.6vh,16px)) max(env(safe-area-inset-left),clamp(18px,3vw,40px))}

/* ÜST BAR */
.top-bar{display:flex;align-items:center;justify-content:center;position:relative;height:clamp(32px,6vh,46px);flex-shrink:0}
.loc{display:inline-flex;align-items:center;gap:clamp(8px,1.4vh,12px);padding:clamp(4px,.9vh,8px) clamp(14px,2.4vh,22px) clamp(4px,.9vh,8px) clamp(6px,1.1vh,10px);border-radius:999px;cursor:pointer;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pin{width:clamp(22px,4vh,30px);height:clamp(22px,4vh,30px);border-radius:50%;background:rgba(229,72,77,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-text{font-size:clamp(15px,2.9vh,21px);font-weight:500;letter-spacing:-.025em}
.sep{width:1px;height:clamp(12px,2.4vh,18px);background:rgba(255,255,255,.18)}
.date-big{position:absolute;left:0;display:flex;flex-direction:column;line-height:1.12}
.date-big b{font-size:clamp(17px,3.4vh,26px);font-weight:500;letter-spacing:-.03em}
.date-big span{font-size:clamp(12px,2.1vh,16px);font-weight:300;color:var(--tx2);letter-spacing:-.01em}
.gps{position:absolute;right:0;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx2);
  border:1px solid var(--line);padding:3px 10px;border-radius:999px;cursor:pointer}
.gps i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

/* ORTA */
.middle{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:clamp(14px,2.4vw,34px);flex:1;min-height:0;padding:clamp(4px,1vh,10px) 0}
.left{display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1vh,10px)}
.temp-row{display:flex;align-items:center;gap:clamp(8px,1.4vw,16px)}
.temp{display:flex;line-height:.9}
.temp b{font-size:clamp(52px,12vh,92px);font-weight:200;letter-spacing:-.05em}
.temp sup{font-size:clamp(15px,2.8vh,24px);font-weight:300;color:var(--tx2);margin:clamp(6px,1.2vh,12px) 0 0 3px}
.wicon{height:clamp(40px,8.5vh,70px);width:auto;flex-shrink:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
.cond{font-size:clamp(14px,2.4vh,21px);font-weight:300;letter-spacing:-.01em;color:rgba(245,245,247,.9)}
.metrics{display:grid;grid-template-columns:auto auto;gap:clamp(4px,1vh,9px) clamp(16px,2.2vw,28px);margin-top:clamp(2px,.8vh,8px);justify-content:start}
.metric{display:flex;flex-direction:column;gap:2px}
.metric span{display:inline-flex;align-items:center;gap:4px;font-size:clamp(10px,1.4vh,11.5px);color:var(--tx3);font-weight:400}
.metric b{font-size:clamp(13px,2vh,16px);font-weight:400}

/* PUSULA — küçük cam kart */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 30px rgba(0,0,0,.7);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.compass{height:clamp(110px,33vh,200px);aspect-ratio:1.2;border-radius:clamp(16px,3.4vh,26px);display:grid;grid-template-columns:1fr auto;
  padding:clamp(10px,2.2vh,18px) clamp(10px,2vh,16px) clamp(10px,2.2vh,18px) clamp(8px,1.6vh,14px);cursor:pointer;flex-shrink:0}
.c-left{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:0;gap:2px}
.alt{font-size:clamp(28px,8vh,62px);font-weight:200;letter-spacing:-.045em;line-height:1}
.alt-l{font-size:clamp(8.5px,1.9vh,14px);font-weight:300;line-height:1.12;color:var(--tx2)}
.tape{position:relative;width:clamp(54px,13vh,96px)}
.t-in{position:absolute;inset:3px 0}
.ticks{position:absolute;left:0;top:0;bottom:0;width:clamp(22px,5.4vh,42px)}
.ticks i{position:absolute;left:0;right:0;height:1px;background:rgba(245,245,247,.9)}
.letter{position:absolute;right:0;font-size:clamp(14px,3.6vh,28px);font-weight:600;line-height:1;transform:translateY(-50%)}
.letter.top{top:0}.letter.bot{top:100%}
.mk{position:absolute;left:-6px;width:clamp(32px,7.6vh,56px);height:clamp(2.5px,.55vh,4.5px);border-radius:3px;background:var(--red);box-shadow:0 0 8px var(--red-glow);transform:translateY(-50%)}
.mk-l{position:absolute;right:0;font-size:clamp(10px,2.4vh,17px);font-weight:300;transform:translateY(-50%)}
.live-coords{display:flex;align-items:center;gap:clamp(8px,1.4vh,12px);font-size:clamp(10px,1.9vh,14px);font-weight:400;letter-spacing:.02em;white-space:nowrap;color:var(--tx)}
.live-coords i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 2s infinite}

/* HAVA DURUMU SAHNESİ */
.art{display:flex;align-items:center;justify-content:center;height:100%;max-height:clamp(125px,31vh,230px);position:relative;--glow:rgba(255,185,56,.16)}
.art::before{content:'';position:absolute;inset:-14%;background:radial-gradient(closest-side,var(--glow),transparent);transition:background .8s}
.art svg{position:relative;height:100%;width:auto;max-width:100%;overflow:visible;filter:drop-shadow(0 14px 24px rgba(0,0,0,.65))}

/* ORTA KOLON SAĞ: GÜNLÜK */
.right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:clamp(6px,1.2vh,10px)}
.daily{width:100%;max-width:clamp(200px,22vw,260px);border-radius:18px;padding:clamp(6px,1.1vh,11px) clamp(10px,1.3vw,15px);
  display:flex;flex-direction:column;gap:clamp(1px,.4vh,4px)}
.d-row{display:flex;align-items:center;justify-content:space-between;padding:clamp(2px,.45vh,4px) 6px;border-radius:8px;cursor:pointer;position:relative}
.d-row.on::before{content:'';position:absolute;left:-8px;top:18%;bottom:18%;width:2.5px;border-radius:3px;background:var(--red);box-shadow:0 0 8px var(--red)}
.d-l{display:flex;align-items:center;gap:9px;min-width:0}
.d-ic{color:var(--tx2);display:flex}.d-row.on .d-ic{color:var(--tx)}
.d-m{display:flex;flex-direction:column;min-width:0}
.d-day{font-size:clamp(10.5px,1.55vh,12.5px);font-weight:500;line-height:1.15}
.d-sub{font-size:clamp(8.5px,1.2vh,10px);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-t{font-size:clamp(11px,1.6vh,13px);color:var(--tx2)}.d-row.on .d-t{color:var(--tx);font-weight:500}

/* SAATLİK */
.hourly{display:flex;align-items:center;gap:12px;height:auto;min-height:clamp(74px,14.5vh,102px);margin-bottom:clamp(10px,1.8vh,16px);flex-shrink:0}
.wave{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.w-row{display:grid;grid-template-columns:repeat(8,1fr);text-align:center}
.h-t{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:clamp(11.5px,1.8vh,14px);font-weight:300;color:var(--tx2)}
.h-t.on{color:var(--tx);font-weight:500}
.h-dot{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);opacity:0}.h-t.on .h-dot{opacity:1}
.w-line{height:clamp(16px,3.2vh,26px)}.w-line svg{width:100%;height:100%;overflow:visible}
.h-h{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.h-p{font-size:clamp(9px,1.4vh,11px);color:#7fb7ff;font-weight:500;display:flex;align-items:center;gap:3px}.h-p.lo{opacity:.4}.h-p.hi{color:var(--red);font-weight:600;text-shadow:0 0 8px var(--red-glow)}
.h-h span{font-size:clamp(9.5px,1.3vh,11px);color:var(--tx3);padding:1.5px 8px;border-radius:6px}
.h-h.on span{background:rgba(255,255,255,.09);color:var(--tx)}
.arrows{display:flex;flex-direction:column;gap:6px}
.arr{width:clamp(24px,4.4vh,32px);height:clamp(24px,4.4vh,32px);border-radius:9px;border:1px solid var(--line);color:var(--tx2);font-size:15px;display:flex;align-items:center;justify-content:center}
.arr:active{background:rgba(255,255,255,.1)}

/* RADYO — OLED siyah bar player */
.dock{display:flex;align-items:center;justify-content:center;flex-shrink:0;height:clamp(54px,10.5vh,68px)}
.player{width:min(640px,92vw);height:100%;border-radius:2px;
  background:#000000;
  border:1px solid #000000;
  box-shadow:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(9px,1.6vh,13px) clamp(18px,2.6vw,26px)}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.p-meta{flex:1;min-width:0;font-size:clamp(12px,2vh,14.5px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-song{color:#f2f2f4;font-weight:500}
.p-sep{color:rgba(242,242,244,.55);font-weight:300;margin:0 5px}
.p-chan{color:rgba(242,242,244,.72);font-weight:400}
.transport{display:flex;align-items:center;gap:clamp(14px,2vw,22px);flex-shrink:0}
.skip{width:clamp(15px,2.4vh,18px);height:clamp(15px,2.4vh,18px);color:#d97724;display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .15s}
.skip:active{transform:scale(.88);filter:brightness(1.2)}
.skip svg{width:100%;height:100%}
.play{width:clamp(19px,3.2vh,24px);height:clamp(19px,3.2vh,24px);color:#d97724;display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .15s}
.play:active{transform:scale(.9);filter:brightness(1.2)}
.play svg{width:100%;height:100%}
.bar{position:relative;width:100%;height:2.5px;background:#141416;cursor:pointer;overflow:visible}
.bar i{position:relative;display:block;height:100%;width:72%;background:#2c2c32}
.bar i::after{content:'';position:absolute;right:-4px;top:50%;width:7px;height:7px;border-radius:50%;background:#3f3f46;box-shadow:none;transform:translateY(-50%)}
.bar i.live{animation:live 2.8s ease-in-out infinite}@keyframes live{50%{opacity:.65}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.panel{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font-size:14px;outline:none}
.res{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto}
.opt{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;cursor:pointer}
.opt:active{background:rgba(229,72,77,.25)}
.times{display:none!important}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="cg" cx="45%" cy="28%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#cfcfd2"/><stop offset="1" stop-color="#7a7a80"/></radialGradient>
  <radialGradient id="dg" cx="45%" cy="28%" r="70%"><stop offset="0" stop-color="#c4c7cd"/><stop offset=".6" stop-color="#7d8087"/><stop offset="1" stop-color="#43454b"/></radialGradient>
  <radialGradient id="sg" cx="38%" cy="35%" r="65%"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#ffb938"/><stop offset="1" stop-color="#c97a0a"/></radialGradient>
  <radialGradient id="mg" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#d5dbea"/><stop offset="1" stop-color="#8d96ad"/></radialGradient>
  <mask id="mm" maskContentUnits="objectBoundingBox"><rect x="-1" y="-1" width="3" height="3" fill="#fff"/><circle cx=".76" cy=".34" r=".42" fill="#000"/></mask>
</defs></svg>

<div id="bgPhoto" class="bg-photo"></div>
<div class="bg-vignette"></div>
<input type="file" id="mp3Input" accept="audio/*" multiple />
<input type="file" id="photoInput" accept="image/*" multiple />
<audio id="audioTag" preload="none"></audio>

<div class="screen">
  <header class="top-bar">
    <div class="loc" onclick="openCity()">
      <span class="pin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <span class="loc-text" id="locText">Konum alınıyor</span>
    </div>
    <div class="date-big"><b id="dayName"></b><span id="dayDate"></span></div>
    <div class="gps" onclick="forceGps()"><i></i><span id="gpsText">GPS bekleniyor</span></div>
  </header>

  <main class="middle">
    <section class="left">
            <div class="temp-row">
        <div class="temp"><b id="mainTemp">--</b><sup>°c</sup></div>
      </div>
      <div class="cond" id="mainCond">Yükleniyor</div>
      <div class="metrics">
        <div class="metric"><span>Rüzgar</span><b id="windText">--</b></div>
        <div class="metric"><span>Nem</span><b id="humText">--</b></div>
        <div class="metric"><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0M2 18h20M12 10V2M9 5l3-3 3 3"/></svg> Gün doğumu</span><b id="sunUp">--:--</b></div>
        <div class="metric"><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0M2 18h20M12 2v8M9 7l3 3 3-3"/></svg> Gün batımı</span><b id="sunDown">--:--</b></div>
      </div>
    </section>

    <section class="art" id="art"></section>

    <section class="right">
      <div class="compass glass" id="compass" onclick="startCompass()">
        <div class="c-left"><div class="alt" id="altVal">--</div><div class="alt-l">deniz seviyesinden<br>metre</div></div>
        <div class="tape"><div class="t-in" id="tapeIn">
        <div class="ticks" id="ticks"></div>
        <span class="letter top" id="cTop">N</span><span class="letter bot" id="cBot">E</span>
        <div class="mk" id="mk" style="top:50%"></div><span class="mk-l" id="mkL" style="top:50%">dokun</span>
      </div></div>
      </div>
      <div class="live-coords"><i></i><span id="latDms">--</span><span id="lonDms">--</span></div>
    </section>
  </main>

  <section class="hourly">
    <div class="wave">
      <div class="w-row" id="wTemps"></div>
      <div class="w-line"><svg viewBox="0 0 800 28" preserveAspectRatio="none"><path id="wPath" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="1.4"/></svg></div>
      <div class="w-row" id="wHours"></div>
    </div>
    <div class="arrows"><button class="arr" onclick="stepHour(-1)">‹</button><button class="arr" onclick="stepHour(1)">›</button></div>
  </section>

  <footer class="dock">
    <div class="player">
      <div class="p-top">
        <div class="p-meta"><span class="p-song" id="songLabel"></span><span class="p-sep">-</span><span class="p-chan" id="artistLabel"></span></div>
        <div class="transport">
          <button class="skip" aria-label="Önceki kanal" onclick="prevSong()"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="11 19 2 12 11 5"/><polygon points="22 19 13 12 22 5"/></svg></button>
          <button class="play" aria-label="Oynat / duraklat" onclick="togglePlay()"><svg id="ppSvg" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></button>
          <button class="skip" aria-label="Sonraki kanal" onclick="nextSong()"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="13 19 22 12 13 5"/><polygon points="2 19 11 12 2 5"/></svg></button>
        </div>
      </div>
      <div class="bar" onclick="scrub(event)" id="barTrack"><i id="barFill"></i></div>
    </div>
  </footer>
</div>

<div class="modal" id="cityModal" onclick="closeCity()">
  <div class="panel" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-size:14px;font-weight:500">Konum seç</strong>
      <button onclick="forceGps();closeCity()" style="border:1px solid var(--red);color:var(--red);padding:5px 12px;border-radius:9px;font-size:12px">GPS'e dön</button>
    </div>
    <input id="cityInput" class="search" placeholder="Şehir yazın (Bolu, Ankara, Edirne…)" />
    <div class="res" id="cityRes"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- ARKA PLAN FOTOĞRAFLARI ---------- */
const BG_FILES = ["arka-plan-1.jpg","arka-plan-2.jpg","arka-plan-3.jpg"];
let bgList = [], bgIdx = 0;
BG_FILES.forEach(f => { const i = new Image(); i.onload = () => { bgList.push(`url("${f}")`); if (bgList.length === 1) $('bgPhoto').style.backgroundImage = bgList[0]; }; i.src = f; });
function switchBg(){ if (bgList.length){ bgIdx = (bgIdx+1)%bgList.length; $('bgPhoto').style.backgroundImage = bgList[bgIdx]; } else $('photoInput').click(); }
$('photoInput').addEventListener('change', e => {
  const fs = [...e.target.files]; if (!fs.length) return;
  bgList = fs.map(f => `url("${URL.createObjectURL(f)}")`); bgIdx = 0; $('bgPhoto').style.backgroundImage = bgList[0];
});

/* ---------- İKONLAR ---------- */
const CL=(f,tr='')=>`<g fill="url(#${f})" transform="${tr}"><circle cx="95" cy="82" r="44"/><circle cx="145" cy="72" r="52"/><circle cx="188" cy="96" r="36"/><circle cx="62" cy="102" r="32"/><rect x="58" y="88" width="135" height="44" rx="22"/></g>`;
const SUN=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r*1.45}" fill="rgba(255,185,56,.14)"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#sg)"/>`;
const MOON=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#mg)" mask="url(#mm)"/>`;
const GLOW={sun:'rgba(255,185,56,.18)',pcloud:'rgba(255,185,56,.12)',cloud:'rgba(190,200,220,.1)',fog:'rgba(190,200,220,.1)',rain:'rgba(110,170,255,.14)',snow:'rgba(200,225,255,.14)',storm:'rgba(255,185,56,.2)'};
function bigArt(t,night){
  const lines=(a)=>`<g stroke="#7fb7ff" stroke-width="4" stroke-linecap="round">${a}</g>`;
  const b={
    sun: night?MOON(120,110,56):SUN(120,110,54),
    pcloud:(night?MOON(178,70,36):SUN(178,70,34))+CL('cg','translate(0 16)'),
    cloud:CL('dg','translate(30 -10) scale(.78)')+CL('cg','translate(0 22)'),
    fog:CL('cg','translate(0 -12)')+`<g stroke="rgba(255,255,255,.55)" stroke-width="7" stroke-linecap="round"><path d="M64 150h130M84 168h110M70 186h100"/></g>`,
    rain:CL('dg','translate(0 -10)')+lines('<path d="M92 142l-9 30M126 146l-9 34M160 142l-9 30M193 146l-9 30"/>'),
    snow:CL('cg','translate(0 -10)')+`<g fill="#fff"><circle cx="90" cy="156" r="5"/><circle cx="130" cy="174" r="5"/><circle cx="170" cy="154" r="5"/><circle cx="112" cy="198" r="4.5"/><circle cx="152" cy="200" r="4.5"/><circle cx="196" cy="180" r="4.5"/></g>`,
    storm:CL('dg','translate(0 -12)')+`<polygon points="134,112 108,160 129,160 114,208 164,146 139,146 152,112" fill="url(#sg)" style="filter:drop-shadow(0 0 12px rgba(255,185,56,.7))"/>`
  }[t]||'';
  return `<svg viewBox="0 0 260 220">${b}</svg>`;
}
function setArt(t,night){ const a=$('art'); a.innerHTML=bigArt(t,night); a.style.setProperty('--glow',night&&t==='sun'?'rgba(190,205,240,.14)':(GLOW[t]||GLOW.cloud)); }
function smallIcon(t){
  const c=`<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>`;
  const x=t==='sun'?`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/>`
    :t==='storm'?c+`<path d="M13 13l-2 4h3l-2 4"/>`:t==='rain'?c+`<path d="M10 19l-1 3M14 19l-1 3"/>`
    :t==='snow'?c+`<path d="M9 21h.01M13 21h.01M11 23h.01"/>`:t==='fog'?`<path d="M4 8h16M2 13h14M6 18h14"/>`:c;
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">${x}</svg>`;
}
function wx(code){
  if (code===0) return {label:"Açık ve güneşli",short:"Güneşli",type:"sun"};
  if ([1,2].includes(code)) return {label:"Parçalı bulutlu",short:"Parçalı bulutlu",type:"pcloud"};
  if (code===3) return {label:"Çok bulutlu",short:"Bulutlu",type:"cloud"};
  if ([45,48].includes(code)) return {label:"Sisli",short:"Sisli",type:"fog"};
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {label:"Yağmurlu",short:"Yağışlı",type:"rain"};
  if ([71,73,75,77,85,86].includes(code)) return {label:"Kar yağışlı",short:"Karlı",type:"snow"};
  if ([95,96,99].includes(code)) return {label:"Fırtına ve sağanak",short:"Fırtınalı",type:"storm"};
  return {label:"Bulutlu",short:"Bulutlu",type:"cloud"};
}

/* ---------- PUSULA / RAKIM / KOORDİNAT ---------- */
const NAMES = ['N','E','S','W'];
(function buildTicks(){
  let h=''; for (let i=0;i<=18;i++) h += `<i style="top:calc(${i/18*100}% - .5px)"></i>`;
  $('ticks').innerHTML = h;
})();
const pad = n => String(n).padStart(2,'0');
function dms(v, pos, neg){
  const a = Math.abs(v); let d = Math.floor(a), m = Math.floor((a-d)*60), s = Math.round(((a-d)*60-m)*60);
  if (s===60){ s=0; m++; } if (m===60){ m=0; d++; }
  return `${d}°${pad(m)}'${pad(s)}" ${v>=0?pos:neg}`;
}
let heading = null, compassOn = false, gpsHeadTime = 0, gpsAlt = null, elev = null;
function setHeading(target){
  if (heading===null) heading = target;
  else { let d = ((target-heading+540)%360)-180; heading = (heading + d*0.18 + 360)%360; }
  const q = Math.floor(heading/90)%4, pct = (heading - q*90)/90*100;
  $('cTop').textContent = NAMES[q]; $('cBot').textContent = NAMES[(q+1)%4];
  $('mk').style.top = pct+'%'; $('mkL').style.top = pct+'%';
  $('mkL').textContent = Math.round(heading)%360;
}
function onOrient(e){
  if (Date.now()-gpsHeadTime < 5000) return;
  let h = typeof e.webkitCompassHeading==='number' ? e.webkitCompassHeading : (e.absolute && e.alpha!=null ? 360-e.alpha : null);
  if (h==null) return;
  const ang = (screen.orientation && screen.orientation.angle!=null) ? screen.orientation.angle : (window.orientation||0);
  setHeading((h + ang + 360) % 360);
}
function startCompass(){
  if (compassOn) return; compassOn = true;
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function'){
    D.requestPermission().then(r => { if (r==='granted') window.addEventListener('deviceorientation', onOrient, true); else compassOn=false; }).catch(()=>{compassOn=false;});
  } else {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  }
}
document.addEventListener('click', startCompass, {once:true});
function updateGeo(c){
  $('latDms').textContent = dms(c.latitude,'N','S');
  $('lonDms').textContent = dms(c.longitude,'E','W');
  if (c.altitude!=null && isFinite(c.altitude)) { gpsAlt = c.altitude; $('altVal').textContent = Math.round(gpsAlt); }
  else if (elev!=null) $('altVal').textContent = Math.round(elev);
  if (c.speed>2 && c.heading!=null && isFinite(c.heading)){ gpsHeadTime = Date.now(); setHeading(c.heading); }
}

/* ---------- GPS ---------- */
const KM_TH = 3, T_TH = 3*60*1000;
let lastLat=null,lastLon=null,lastFetch=0,manual=false;
function distKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;
  const x=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
async function placeName(lat,lon){
  try{
    const d = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=tr`)).json();
    const a=d.locality||d.city||"", p=d.principalSubdivision||"";
    if (a && p && a!==p) return `${a}, ${p}`;
    return p ? `${p}, ${d.countryName||''}` : (a||"GPS konumu");
  }catch{ return "GPS konumu"; }
}
async function onCoords(lat,lon,force){
  const now=Date.now(), moved = lastLat!==null ? distKm(lastLat,lastLon,lat,lon) : 0;
  if (force || lastLat===null || moved>=KM_TH || now-lastFetch>=T_TH){
    lastLat=lat; lastLon=lon; lastFetch=now;
    $('gpsText').textContent = 'GPS • '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    fetchWeather(lat,lon,await placeName(lat,lon));
  } else $('gpsText').textContent = `GPS • +${moved.toFixed(1)} km`;
}
function startGps(){
  if (!('geolocation' in navigator)) return ipFallback();
  navigator.geolocation.watchPosition(p => { updateGeo(p.coords); if (!manual) onCoords(p.coords.latitude,p.coords.longitude,false); },
    () => { if (lastLat===null) ipFallback(); }, {enableHighAccuracy:true,maximumAge:10000,timeout:10000});
  setInterval(() => { if (!manual) navigator.geolocation.getCurrentPosition(p => onCoords(p.coords.latitude,p.coords.longitude,false), ()=>{}, {enableHighAccuracy:true,timeout:8000}); }, T_TH);
}
function forceGps(){
  manual=false; $('gpsText').textContent='GPS güncelleniyor';
  if ('geolocation' in navigator) navigator.geolocation.getCurrentPosition(p => { updateGeo(p.coords); onCoords(p.coords.latitude,p.coords.longitude,true); }, ipFallback, {enableHighAccuracy:true,maximumAge:0,timeout:8000});
  else ipFallback();
}
async function ipFallback(){
  try{ const d = await (await fetch('https://ipwho.is/')).json();
    if (d && d.latitude){ $('gpsText').textContent='Ağ konumu'; return fetchWeather(d.latitude,d.longitude,`${d.city}, ${d.country}`); } }catch{}
  fetchWeather(41.0082,28.9784,"İstanbul, Türkiye");
}

/* ---------- HAVA DURUMU ---------- */
const DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
let days=[], aDay=0, aHour=1;
async function fetchWeather(lat,lon,place){
  try{
    const d = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=temperature_2m,precipitation_probability&daily=weather_code,temperature_2m_max,sunrise,sunset&timezone=auto`)).json();
    const now=new Date();
    $('locText').textContent=place;
    
    if (typeof d.elevation==='number'){ elev=d.elevation; if (gpsAlt==null) $('altVal').textContent=Math.round(elev); }
    const cur=Math.round(d.current.temperature_2m), info=wx(d.current.weather_code);
    $('mainTemp').textContent=cur; $('mainCond').textContent=info.label;
    $('windText').textContent=d.current.wind_speed_10m.toFixed(1)+' km/sa';
    $('humText').textContent='%'+Math.round(d.current.relative_humidity_2m);
    setArt(info.type,d.current.is_day===0);
    $('sunUp').textContent=(d.daily.sunrise[0]||'').slice(11,16)||'--:--'; $('sunDown').textContent=(d.daily.sunset[0]||'').slice(11,16)||'--:--';
    days=[];
    for (let i=0;i<6;i++){
      const dt=new Date(d.daily.time[i]+"T12:00:00"), w=wx(i===0?d.current.weather_code:d.daily.weather_code[i]);
      const st=+(d.current.time||"T08").slice(11,13)||0; const hrs=i===0?[0,1,2,3,4,5,6,7].map(k=>st+k):[8,9,10,11,12,13,14,15];
      days.push({day:i===0?"Bugün":DAYS[dt.getDay()],short:w.short,label:w.label,type:w.type,night:i===0&&d.current.is_day===0,max:Math.round(d.daily.temperature_2m_max[i]),
        hours:hrs.map(h=>pad(h%24)+':00'),pops:hrs.map(h=>Math.round(d.hourly.precipitation_probability?.[i*24+h]??0)),temps:hrs.map(h=>Math.round(d.hourly.temperature_2m[i*24+h]??cur))});
    }
    aDay=0; aHour=0; drawWave();
  }catch{}
}
function drawWave(){
  if (!days.length) return;
  const d=days[aDay], tr=$('wTemps'), hr=$('wHours'); tr.innerHTML=''; hr.innerHTML='';
  d.temps.forEach((t,i)=>{
    const a=document.createElement('div'); a.className='h-t'+(i===aHour?' on':''); a.innerHTML=`<span>${t}°</span><span class="h-dot"></span>`; a.onclick=()=>{aHour=i;drawWave();}; tr.appendChild(a);
    const b=document.createElement('div'); b.className='h-h'+(i===aHour?' on':''); b.innerHTML=`<span>${d.hours[i]}</span><span class="h-p${d.pops[i]<10?' lo':''}${d.pops[i]>=60?' hi':''}"><svg width="7" height="9" viewBox="0 0 10 14" fill="currentColor"><path d="M5 0C5 0 0 6 0 9a5 5 0 0 0 10 0C10 6 5 0 5 0z"/></svg>${d.pops[i]}%</span>`; b.onclick=()=>{aHour=i;drawWave();}; hr.appendChild(b);
  });
  const mn=Math.min(...d.temps), mx=Math.max(...d.temps);
  const p=d.temps.map((t,i)=>({x:(i+.5)*100,y:23-(mx===mn?.5:(t-mn)/(mx-mn))*17}));
  let s=`M ${p[0].x} ${p[0].y}`;
  for (let i=0;i<p.length-1;i++){ const m=(p[i].x+p[i+1].x)/2; s+=` C ${m} ${p[i].y}, ${m} ${p[i+1].y}, ${p[i+1].x} ${p[i+1].y}`; }
  $('wPath').setAttribute('d',s);
}
function stepHour(n){ aHour=(aHour+n+8)%8; drawWave(); }

/* ---------- RADYO ---------- */
const audio=$('audioTag');
const S=(a,t,b,u)=>({artist:a,title:t,badge:b,url:u,isRadio:true});
const SW="https://playerservices.streamtheworld.com/api/livestream-redirect/";
let tracks=[
  S("Nightride FM","Synthwave • gece sürüşü","NIGHTRIDE\nFM","https://stream.nightride.fm/nightride.mp3"),
  S("Chillsynth FM","Chill ve outrun","CHILL\nSYNTH","https://stream.nightride.fm/chillsynth.mp3"),
  S("Darksynth FM","Darksynth","DARK\nSYNTH","https://stream.nightride.fm/darksynth.mp3"),
  S("Datawave FM","Datawave","DATA\nWAVE","https://stream.nightride.fm/datawave.mp3"),
  S("Spacesynth FM","Spacesynth","SPACE\nSYNTH","https://stream.nightride.fm/spacesynth.mp3"),
  S("SomaFM Groove Salad","Ambient ve downtempo","GROOVE\nSALAD","https://ice1.somafm.com/groovesalad-128-mp3"),
  S("SomaFM Drone Zone","Derin uzay ve atmosfer","DRONE\nZONE","https://ice1.somafm.com/dronezone-128-mp3"),
  S("SomaFM Space Station","Mid-tempo elektronik","SPACE\nSOMA","https://ice1.somafm.com/spacestation-128-mp3"),
  S("SomaFM Vaporwaves","Vaporwave ve retro","VAPOR\nWAVES","https://ice1.somafm.com/vaporwaves-128-mp3"),
  S("SomaFM Secret Agent","Lounge ve caz","SECRET\nAGENT","https://ice1.somafm.com/secretagent-128-mp3"),
  S("SomaFM Lush","Yumuşak vokaller","SOMA\nLUSH","https://ice1.somafm.com/lush-128-mp3"),
  S("Power FM","Türkiye • yabancı hit","POWER\nFM","https://listen.powerapp.com.tr/powerfm/mpeg/icecast.audio"),
  S("Power Türk","Türkiye • Türkçe pop","POWER\nTÜRK","https://listen.powerapp.com.tr/powerturk/mpeg/icecast.audio"),
  S("Power Love","Türkiye • slow ve romantik","POWER\nLOVE","https://listen.powerapp.com.tr/powerlove/mpeg/icecast.audio"),
  S("Virgin Radio TR","Türkiye • yabancı pop","VIRGIN\nRADIO",SW+"VIRGIN_RADIO_TR.mp3"),
  S("Metro FM","Türkiye • hit müzik","METRO\nFM",SW+"METRO_FM.mp3"),
  S("Süper FM","Türkiye • Türkçe hit","SÜPER\nFM",SW+"SUPER_FM.mp3"),
  S("Joy Türk","Türkiye • Türkçe slow","JOY\nTÜRK",SW+"JOY_TURK.mp3"),
  S("Radio Paradise","Global • eklektik","RADIO\nPARADISE","https://stream.radioparadise.com/mp3-128")
];
let ti=0, playing=false, liveSec=0, liveTimer=null, skipTimer=null;
const fmt=s=>{ if(!isFinite(s)||s<0) return "0:00"; return Math.floor(s/60)+':'+pad(Math.floor(s%60)); };
function ui(sub){
  const t=tracks[ti];
  $('songLabel').textContent=sub||t.title;
  $('artistLabel').textContent=t.artist;
  const f=$('barFill');
  if (t.isRadio){ f.style.width='74%'; f.classList.toggle('live',playing); }
  else f.classList.remove('live');
  $('ppSvg').innerHTML = playing ? `<rect x="5" y="4" width="4.5" height="16" rx="1"/><rect x="14.5" y="4" width="4.5" height="16" rx="1"/>` : `<polygon points="6 4 20 12 6 20"/>`;
}
function liveStart(){ clearInterval(liveTimer); liveTimer=setInterval(()=>{ if(playing&&tracks[ti].isRadio) liveSec++; },1000); }
function select(i,go=true){
  clearTimeout(skipTimer); clearInterval(liveTimer); liveSec=0;
  ti=(i+tracks.length)%tracks.length; const t=tracks[ti];
  audio.pause(); audio.removeAttribute('src'); audio.load();
  if (go){ playing=true; ui(t.isRadio?"Yayına bağlanıyor…":t.title); audio.src=t.url; audio.play().catch(()=>{ playing=false; ui("Başlatmak için oynat tuşuna basın"); }); }
  else { playing=false; ui(); }
}
function togglePlay(){
  const t=tracks[ti];
  if (!playing){
    if (!audio.src || audio.src===location.href) return select(ti,true);
    playing=true; ui(t.isRadio?"Yayına bağlanıyor…":t.title); audio.play().catch(()=>{playing=false;ui();});
  } else { audio.pause(); playing=false; clearInterval(liveTimer); ui(); }
}
const nextSong=()=>select(ti+1,true), prevSong=()=>select(ti-1,true);
audio.addEventListener('playing',()=>{ playing=true; ui(); if(tracks[ti].isRadio) liveStart(); });
audio.addEventListener('waiting',()=>{ if(playing) ui("Tamponlanıyor…"); });
audio.addEventListener('error',()=>{ if(!playing) return; ui("Kanal yanıt vermiyor, sonrakine geçiliyor…"); skipTimer=setTimeout(nextSong,1500); });
audio.addEventListener('timeupdate',()=>{
  if (tracks[ti].isRadio || !audio.duration || !isFinite(audio.duration)) return;
  $('barFill').style.width=(audio.currentTime/audio.duration*100)+'%';
});
audio.addEventListener('ended',()=>{ if(!tracks[ti].isRadio) nextSong(); });
function scrub(e){
  if (tracks[ti].isRadio || !audio.duration || !isFinite(audio.duration)) return;
  const r=$('barTrack').getBoundingClientRect(); audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration;
}
$('mp3Input').addEventListener('change',e=>{
  const fs=[...e.target.files]; if(!fs.length) return;
  tracks=[...fs.map(f=>({artist:"Yerel MP3",title:f.name.replace(/\.[^/.]+$/,""),badge:"YEREL\nMP3",url:URL.createObjectURL(f),isRadio:false})),...tracks];
  select(0,true);
});

/* ---------- ŞEHİR ARAMA ---------- */
let st=null;
function openCity(){ $('cityModal').classList.add('open'); setTimeout(()=>$('cityInput').focus(),50); }
function closeCity(){ $('cityModal').classList.remove('open'); }
$('cityInput').addEventListener('input',e=>{
  clearTimeout(st); const q=e.target.value.trim(); if(q.length<2) return;
  st=setTimeout(async()=>{
    try{
      const d=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr`)).json();
      const l=$('cityRes'); l.innerHTML='';
      (d.results||[]).forEach(it=>{
        const o=document.createElement('div'); o.className='opt'; o.textContent=`${it.name}${it.admin1?', '+it.admin1:''} (${it.country||''})`;
        o.onclick=()=>{ manual=true; $('gpsText').textContent='Seçili şehir'; fetchWeather(it.latitude,it.longitude,`${it.name}, ${it.country||''}`); closeCity(); };
        l.appendChild(o);
      });
    }catch{}
  },300);
});

function setDate(){const n=new Date();$('dayName').textContent=DAYS[n.getDay()];$('dayDate').textContent=n.getDate()+' '+MONTHS[n.getMonth()];}
setDate(); setInterval(setDate,60000);
ui(); startGps();
</script>
